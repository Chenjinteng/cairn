# cairn 镜像列表页 — 真实删除场景（tag 级，破坏性，仅限 dev）
#
# 覆盖一条真实删除路径：
#   抽屉内按 tag 删 → DELETE /api/tags?repository=&tag=
#                      （后端 TagDigest 解析 digest 后 DeleteManifest，即「按 digest 删除」的 UI 入口）
# 删除只解除引用，磁盘回收要跑 GC —— 见 gc-real.yaml（独立场景，避免 GC 耗时掐断删除证据）。
#
# 仓库级删除（DELETE /api/repositories/{repo}）拆到独立场景 delete-repo-real.yaml：
#   v0.5.29 起镜像列表行内不再有「删除仓库」入口（见 images-page.tsx:229-242 的决策注释），
#   该场景因此改为「UI 负向回归守卫 + 后端保留端点契约验证」。
#
# ⚠️ 破坏性：会真的删掉 registry 里的 webauto-pull/busybox。
#    dev 环境数据不作数（2026-09-27 用户授权），其他环境不要跑。
#
# ⚠️ 选择器要点（逐条对着源码核过）
#   1. 抽屉里 tag 行的删除按钮是**纯 icon**（icon={<DeleteOutlined/>}，无 children）
#      → 没有文案可依赖，只能用 .ant-btn-dangerous 定位；同列 CopyOutlined 按钮非 danger，可区分。
#   2. 抽屉删除的 Popconfirm：title=「确认删除 <tag>？」、okText=「确认删除」（4 汉字 → 不插空格）。
#   3. v0.5.27 起「删 tag 成功」**不再画 drawer 内 Alert**，改走顶部 message toast
#      （image-detail-drawer.tsx:86-95 的成功分支只有 message.success(`已删除 tag ${tag}`)）。
#      只有**失败**才 setNotice → 渲染 drawer 顶部 Alert（`.ant-alert-warning`，message 取后端文案）。
#      → 旧断言 `.ant-drawer .ant-alert-success` 在 0.5.27+ 必然失效，已改为「toast 快照」两步。
#   4. message 是命令式 API、3 秒自动消失，直接 assert 会撞竞态 → 页内轮询抓文本 + 注入
#      DOM 标记 #__tag_toast，再对标记做 assert（evaluate 无断言能力，只能这样搭闸门）。
#   5. 弹窗一律加 :not(.ant-popover-hidden) 作用域（antd 关闭后节点驻留 DOM，
#      runner 的 css 定位非 strict、取首个匹配 —— 见 images-page.yaml 头部说明）。
#   6. 删 tag 后仓库行**不会消失**：后端 buildRepoView 无论 tags 是否为空都回带 name，
#      前端 handleDeleted 用同名快照替换 → 行仍在、Tag 数变 0。故末步仍能断言该行可见。
#
# 步数 × 时长口径：runner.js:274 `stepTimeoutMs = timeout / max(steps, 5)`。
#   本场景 19 步、跑时传 timeout=300000 → 单步硬上限 300000/19 = 15789ms，
#   故所有显式 timeout ≤12000ms、页内轮询 LIMIT=10000ms 都在预算内。
#
# 前置：webauto-pull/busybox:latest 存在（由 pull-real.yaml 拉入）
# 用法：POST /api/run {scenario: "cairn/delete-tag-real", env: "dev", timeout: 300000}
name: cairn-delete-tag-real
description: |
  真实删除（tag 级；dev 专用，破坏性）：
    1. 搜索定位 webauto-pull/busybox
    2. 打开镜像详情抽屉，删除 tag latest（后端按 digest 删 manifest）
    3. 轮询顶部 toast 断言「已删除 tag latest」（v0.5.27 起成功不再画 drawer Alert）
    4. 断言抽屉 tag 列表变空态
    5. 关闭抽屉，断言仓库行仍在（删 tag 不改仓库存在性）
  收尾即绿：删 tag 后仓库仍在是期望行为；仓库级删除见 delete-repo-real.yaml。
env: dev
tags: [destructive, images, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  # ---- 0. 导航 ----
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 12000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 12000

  - name: 点击「镜像列表」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像列表", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像列表")' }
    timeout: 8000

  - name: 等待列表页就绪（搜索框）
    action: assert
    type: visible
    selector: '.app-content input[placeholder*="搜索"]'
    timeout: 12000

  # ---- 1. 搜索定位目标仓库 ----
  - name: 搜索「webauto-pull」
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder*="搜索"]' }
    value: "webauto-pull"
    timeout: 8000

  - name: 等待目标行出现
    action: waitFor
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row:has-text("webauto-pull/busybox")' }
    timeout: 12000

  - name: delete-before
    action: screenshot

  # ---- 2. 打开抽屉，按 tag 删除 ----
  - name: 点击仓库名打开详情抽屉
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-content button.link-cell:has-text("webauto-pull/busybox")' }
    timeout: 8000

  - name: 等待抽屉内 tag 行（latest）
    action: assert
    type: visible
    selector: '.ant-drawer .ant-table-tbody tr.ant-table-row:has-text("latest")'
    timeout: 12000

  - name: drawer-open
    action: screenshot

  - name: 点击该 tag 行的删除按钮（纯 icon）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-drawer .ant-table-tbody tr.ant-table-row:has-text("latest") button.ant-btn-dangerous' }
    timeout: 8000

  - name: 断言「确认删除 latest？」二次确认
    action: assert
    type: visible
    selector: '.ant-popconfirm:not(.ant-popover-hidden):has-text("确认删除 latest？")'
    timeout: 8000

  - name: 点击「确认删除」（真删）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("确认删除")' }
    timeout: 8000

  # evaluate 无断言能力（runner.js 的 case 'evaluate' 只 return {status,result}）：
  # 「等条件」一律脚本内轮询 → 注入 DOM 标记 → 再由 assert 读标记做硬闸门。
  - name: 轮询删除结果 toast 并注入快照标记
    action: evaluate
    script: |
      (async () => {
        const t0 = Date.now();
        const LIMIT = 10000;
        const STEP = 200;
        let picks = [];
        const snap = () => Array.from(document.querySelectorAll('.ant-message-notice-content'))
          .map(el => (el.innerText || '').replace(/\s+/g, ' ').trim())
          .filter(t => !!t);
        while (Date.now() - t0 < LIMIT) {
          picks = snap();
          if (picks.some(s => s.indexOf('已删除 tag') >= 0 || s.indexOf('删除失败') >= 0)) break;
          await new Promise(r => setTimeout(r, STEP));
        }
        const old = document.getElementById('__tag_toast');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__tag_toast';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = picks.join(' | ') || '(no-message)';
        document.body.appendChild(d);
        return JSON.stringify({ outcome: picks.length ? 'captured' : 'empty', elapsedMs: Date.now() - t0, picks: picks });
      })()

  - name: 断言提示为「已删除 tag latest」
    action: assert
    type: text
    selector: '#__tag_toast'
    value: "已删除 tag latest"
    match: contains
    timeout: 6000

  - name: 断言抽屉 tag 列表变空态
    action: assert
    type: visible
    selector: '.ant-drawer .ant-empty-description:has-text("该仓库当前没有可用的 tag")'
    timeout: 12000

  - name: drawer-after-delete
    action: screenshot

  # ---- 3. 关抽屉，断言仓库仍在（场景收尾）----
  - name: 关闭抽屉
    action: click
    locator:
      strategies:
        - { type: css, value: ".ant-drawer-close" }
    timeout: 8000

  - name: 断言仓库行仍在（删 tag 不改仓库存在性）
    action: assert
    type: visible
    selector: '.app-content tr.ant-table-row:has-text("webauto-pull/busybox")'
    timeout: 12000

# 期望结果（步数与 steps 逐一对应：19）
expected:
  totalSteps: 19
  maxDuration: 300000