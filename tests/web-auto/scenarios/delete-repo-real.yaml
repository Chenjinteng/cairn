# cairn 镜像列表页 — 「单段名仓库删除端点**真删** + UI 刷新收敛」场景（**破坏性**）
#
# ⚠️ 本场景会**真的删掉** 158 dev registry 里的 webauto-single2 仓库（连带删除该仓库目录），
#   只能在一次性 dev / 被测数据上跑，禁止对任何有真实数据的实例执行。
#
# 为什么走页内 fetch 而不是点 UI：
#   v0.5.29 起镜像列表行内**不再有「删除仓库」入口**（images-page.tsx:229-242：一键删整仓既危险
#   又没意义 —— 删 manifest 只解引用，磁盘要 GC 才回收）。但后端端点**刻意保留**
#   （handlers_extra.go:586-608，CHANGELOG 0.5.29 原文「API 契约无变化」），
#   所以本场景用页内 fetch 直接打真实请求路径，验证该保留契约在 0.5.34 上仍然可用。
#
# 实测锚定（2026-09-28，cairn:0.5.34，158 dev）：
#   DELETE /api/repositories/<单段名> → 200 {"repo":"<单段名>","deleted":true}
#   （对比：多段名走 %2F 形态必然 500 storage: not found —— 由 delete-real.yaml 覆盖）
#
# 前置数据：registry 里必须存在 **单段名** 仓库 webauto-single2（由 POST /api/pull/jobs 现造）。
#   为什么用 webauto-single2：
#     1. 单段名（无 `/`）→ 避开 chi 按 RawPath 匹配时 {repo} 原样带 %2F 的坑
#     2. 名称唯一、不在任何其他场景的前置里 → 删掉不影响 delete-tag-real / gc-real
#     3. 与 webauto-pull/busybox（多段名、gc-real 的回收对象）分家，避免互相干扰
#
# ⚠️ 已知且**不算缺陷**的行为：页内 fetch 删除后，表格里那一行会**继续显示到下次刷新**
#   （handlers.go:448-468 buildInventory 无缓存，但前端不轮询；点「刷新」即消失）。
#   本场景第 4 段专门验证刷新收敛，所以「刷新前行仍在」不构成断言失败，也**不要**记成 bug。
#
# ⚠️ 选择器/断言要点（逐条对着源码核过）
#   1. 列表容器是 .app-content（images-page.tsx:252 .page-actions 同层），表格用 antd，
#      存在 aria-hidden 的测量行 tr.ant-table-measure-row → 一律用 `tr.ant-table-row` 定位数据行。
#   2. evaluate 无断言能力（runner.js 的 case 'evaluate' 只 return {status,result}）：
#      一切「页内异步 + 等条件」都写成脚本内轮询/比对 → 注入 DOM 标记 → 再由 assert
#      对标记做硬闸门（本场景标记：#__dr_before / #__dr_probe / #__dr_inv / #__dr_row）。
#   3. assert type:text 走 page.textContent + RegExp.test（**部分匹配**）→ 一律用 ^…$ 全锚定。
#   4. 探针是页内 fetch（同源，无 CORS 问题），打的就是浏览器真实会走的请求路径。
#
# 步数 × 时长口径：runner.js:274 `stepTimeoutMs = timeout / max(steps, 5)`。
#   本场景 14 步、跑时传 timeout=300000（server.js:83 夹 300000）→ 单步硬上限
#   300000/14 = 21428ms，故所有显式 timeout ≤12000ms 都在预算内。
#
# 用法：POST /api/run {scenario: "cairn/delete-repo-real", env: "dev", timeout: 300000}
name: cairn-delete-repo-real
description: |
  单段名仓库删除端点真删 + UI 刷新收敛（破坏性）：
    1. 打开镜像列表，确认 webauto-single2 行存在（缺前置数据 → 脚本内 throw）
    2. 记录删除前 GET /api/inventory 仓库名集合
    3. 页内 fetch DELETE /api/repositories/webauto-single2
    4. 断言 200 {"repo":…,"deleted":true}（0.5.29 刻意保留的端点，单段名可用）
    5. 重取 inventory：removed 恰为 [webauto-single2]、added 为空、after ≥ 1
    6. 点页面「刷新」→ 断言该行消失且其他行仍在
  多段名 %2F 形态不可用由 delete-real.yaml 覆盖；tag 级删除由 delete-tag-real.yaml；
  0 tag 仓库回收由 gc-real.yaml。
env: dev
tags: [destructive, delete, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  # ---- 0. 导航 ----
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 12000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 12000

  - name: 点击「镜像列表」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像列表", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像列表")' }
    timeout: 8000

  - name: 等待 webauto-single2 行出现（前置数据闸门）
    action: assert
    type: visible
    selector: '.app-content table tbody tr.ant-table-row:has-text("webauto-single2")'
    timeout: 12000

  - name: delete-repo-before
    action: screenshot

  # ---- 1. 删除前基线（缺前置数据 → 脚本内 throw）----
  - name: 记录删除前 inventory 仓库名基线
    action: evaluate
    script: |
      (async () => {
        const res = await fetch('/api/inventory', { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('inventory HTTP ' + res.status);
        const json = await res.json();
        const payload = (json && json.data) ? json.data : json;
        const names = ((payload && payload.repositories) || []).map(r => r.name).sort();
        if (names.indexOf('webauto-single2') < 0) {
          throw new Error('前置数据缺失: webauto-single2 不在 inventory 里 (' + names.join(',') + ')');
        }
        const old = document.getElementById('__dr_before');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__dr_before';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'DRBEFORE:count=' + names.length + ':has=single2:names=' + JSON.stringify(names);
        document.body.appendChild(d);
        return JSON.stringify({ count: names.length, names: names });
      })()

  # ---- 2. 单段名端点契约探针（**真删**）----
  - name: 探针 DELETE /api/repositories/webauto-single2
    action: evaluate
    script: |
      (async () => {
        const res = await fetch('/api/repositories/webauto-single2', { method: 'DELETE' });
        const text = await res.text();
        const body = (text || '').replace(/\s+/g, ' ').trim().slice(0, 300);
        const old = document.getElementById('__dr_probe');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__dr_probe';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'DREPO:' + res.status + ':' + body;
        document.body.appendChild(d);
        return JSON.stringify({ status: res.status, body: body });
      })()

  - name: 断言探针回 200 deleted:true
    action: assert
    type: text
    selector: '#__dr_probe'
    value: '^DREPO:200:.*"deleted":true.*$'
    match: regex
    timeout: 6000

  # ---- 3. 存储侧收敛（inventory 无缓存，立刻可见）----
  - name: 重取 inventory 比对增删集合
    action: evaluate
    script: |
      (async () => {
        const bEl = document.getElementById('__dr_before');
        const bRaw = bEl ? (bEl.textContent || '') : '';
        const bIdx = bRaw.indexOf('names=');
        if (bIdx < 0) throw new Error('删除前基线缺失：未读到 #__dr_before 的 names=');
        let before;
        try { before = JSON.parse(bRaw.slice(bIdx + 'names='.length)); } catch (e) { throw new Error('基线解析失败: ' + e.message); }
        if (!Array.isArray(before) || !before.length) throw new Error('删除前基线为空');
        const res = await fetch('/api/inventory', { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('inventory HTTP ' + res.status);
        const json = await res.json();
        const payload = (json && json.data) ? json.data : json;
        const names = ((payload && payload.repositories) || []).map(r => r.name);
        const removed = before.filter(n => names.indexOf(n) < 0).sort();
        const added = names.filter(n => before.indexOf(n) < 0).sort();
        const old = document.getElementById('__dr_inv');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__dr_inv';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'DRINV:removed=' + removed.join(',') + ':added=' + added.join(',') + ':after=' + names.length;
        document.body.appendChild(d);
        if (added.length) throw new Error('删除期间出现了新仓库: ' + added.join(','));
        if (removed.length !== 1 || removed[0] !== 'webauto-single2') {
          throw new Error('removed 集合不符预期: [' + removed.join(',') + ']，应恰为 [webauto-single2]');
        }
        return JSON.stringify({ removed: removed, added: added, after: names.length });
      })()

  - name: 断言只少了 webauto-single2
    action: assert
    type: text
    selector: '#__dr_inv'
    value: '^DRINV:removed=webauto-single2:added=:after=[1-9][0-9]*$'
    match: regex
    timeout: 6000

  # ---- 4. UI 侧收敛（刷新后行消失，其他行仍在）----
  - name: 点击页面「刷新」
    action: click
    locator:
      strategies:
        - { type: css, value: '.page-actions button:has-text("刷新")' }
        - { type: text, value: "刷新", match: exact }
    timeout: 8000

  - name: 轮询目标行消失并注入标记
    action: evaluate
    script: |
      (async () => {
        const t0 = Date.now();
        const LIMIT = 10000;
        const rows = () => Array.from(document.querySelectorAll('.app-content table tbody tr.ant-table-row'));
        const gone = () => !rows().some(tr => (tr.innerText || '').indexOf('webauto-single2') >= 0);
        while (Date.now() - t0 < LIMIT && !gone()) {
          await new Promise(r => setTimeout(r, 200));
        }
        const others = rows().length;
        const old = document.getElementById('__dr_row');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__dr_row';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'DRROW:gone=' + (gone() ? 1 : 0) + ':others=' + others;
        document.body.appendChild(d);
        if (!gone()) throw new Error('刷新后 webauto-single2 行仍在（rows=' + others + '）');
        if (others < 1) throw new Error('刷新后表格空掉了：其他仓库行也没了');
        return JSON.stringify({ elapsedMs: Date.now() - t0, gone: gone(), others: others });
      })()

  - name: 断言目标行已消失且其他行仍在
    action: assert
    type: text
    selector: '#__dr_row'
    value: '^DRROW:gone=1:others=[1-9][0-9]*$'
    match: regex
    timeout: 6000

  - name: delete-repo-after
    action: screenshot

# 期望结果（步数与 steps 逐一对应：14）
expected:
  totalSteps: 14
  maxDuration: 300000