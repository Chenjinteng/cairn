# cairn 镜像热度页 — 深度场景
#
# 覆盖：子 Tab 切换（仓库 / 客户端 / 事件）、贡献图渲染、忽略规则 Modal
#
# 用法：POST /api/run {scenario: "cairn/stats-page", env: "dev"}
name: cairn-stats-page
description: |
  镜像热度页深度交互：
    1. 切到镜像热度 Tab
    2. 检查贡献图渲染（canvas/svg）
    3. 切换子 Tab（仓库 / 客户端 / 事件）
    4. 在事件 Tab 打开「忽略规则」Modal
    5. 关闭 Modal
env: dev
tags: [medium, stats, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: on-failure
  trace: on-failure
  video: never
  har: never

steps:
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 15000

  - name: 点击「镜像热度」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像热度", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像热度")' }
    timeout: 8000

  - name: 等待热度页主体渲染
    action: assert
    type: visible
    selector: '.app-content .ant-segmented, .app-content .ant-card, .app-content .ant-empty'
    timeout: 15000

  # ---- 1. 贡献图 ----
  - name: 断言贡献图渲染（svg/canvas/recharts/heatmap class）
    action: assert
    type: visible
    selector: '.app-content svg, .app-content canvas, .app-content .recharts-wrapper, .app-content [class*="heatmap"], .app-content [class*="contribution"]'
    timeout: 10000

  - name: stats-heatmap
    action: screenshot

  # ---- 2. 子 Tab 切换 ----
  - name: 切到「仓库」子 Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "仓库", match: contains }
        - { type: css, value: '.app-content .ant-segmented-item:has-text("仓库")' }
    timeout: 5000

  - name: 断言仓库列表渲染
    action: assert
    type: visible
    selector: '.app-content .ant-table, .app-content .ant-empty'
    timeout: 10000

  - name: 切到「客户端」子 Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "客户端", match: contains }
        - { type: css, value: '.app-content .ant-segmented-item:has-text("客户端")' }

  - name: 断言客户端表渲染
    action: assert
    type: visible
    selector: '.app-content .ant-table, .app-content .ant-empty'
    timeout: 10000

  - name: 切到「事件」子 Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "事件", match: contains }
        - { type: css, value: '.app-content .ant-segmented-item:has-text("事件")' }

  - name: 断言事件表渲染
    action: assert
    type: visible
    selector: '.app-content .ant-table, .app-content .ant-empty'
    timeout: 10000

  # ---- 3. 忽略规则 Modal ----
  - name: 点击「忽略规则」入口
    action: click
    locator:
      strategies:
        - { type: text, value: "忽略规则", match: contains }
        - { type: css, value: '.app-content button:has-text("忽略规则")' }
    timeout: 5000

  - name: 断言忽略规则 Modal 出现
    action: assert
    type: visible
    selector: '.ant-modal-content, .ant-modal-title:has-text("忽略")'
    timeout: 5000

  - name: 关闭 Modal
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-modal-close' }
        - { type: aria, value: "Close" }
    timeout: 3000

  - name: stats-page-end
    action: screenshot

# 期望结果
expected:
  totalSteps: 15
  maxDuration: 90000