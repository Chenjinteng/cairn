# cairn 代理管理页 — 深度场景
#
# 覆盖：列表渲染、新增 Modal、表单字段填写、关闭 Modal、「探测全部」批量探测
#
# ⚠️ 「探测全部」的真实副作用（不是纯只读）
#   后端 ProbeAll 会并行对每个代理的 ip:端口 做一次纯 TCP 建连（不穿过代理、不发任何请求），
#   结果会写回该代理的 lastProbeStatus / lastProbeAt / lastProbeLatencyMs（落盘）。
#   不新增、不修改代理条目本身，可重复执行。dev 158 上 3 条代理都会探到 ok。
#
# 按钮名不是「批量探测」：真实文案是「探测全部」(web/src/pages/proxies-page.tsx:607)，
# 且 disabled={proxies.length === 0}（:604）。dev 158 上有 3 条代理，故可点。
#
# 用法：POST /api/run {scenario: "cairn/proxies-page", env: "dev"}
name: cairn-proxies-page
description: |
  代理管理页深度交互：
    1. 切到代理管理 Tab
    2. 打开「新增代理」Modal
    3. 在 Modal 填写表单验证可输入
    4. 关闭 Modal
    5. 点击「探测全部」，断言批量探测反馈气泡（已探测 N 个代理：…）
env: dev
tags: [medium, proxies, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: on-failure
  trace: on-failure
  video: never
  har: never

steps:
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 15000

  - name: 点击「代理管理」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "代理管理", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("代理管理")' }
    timeout: 8000

  - name: 等待代理列表渲染
    action: assert
    type: visible
    selector: '.app-content button:has-text("新增代理"), .app-content .ant-table, .app-content .ant-empty'
    timeout: 15000

  # ---- 1. 新增 Modal（只填不提交） ----
  - name: 点击「新增代理」
    action: click
    locator:
      strategies:
        - { type: text, value: "新增代理", match: exact }
        - { type: css, value: '.page-actions button:has-text("新增代理")' }
        - { type: css, value: '.app-content button:has-text("新增")' }
    timeout: 5000

  - name: 断言新增 Modal 标题
    action: assert
    type: text
    selector: '.ant-modal-title'
    value: "新增代理"
    match: exact
    timeout: 5000

  - name: 填写「名称」字段
    action: fill
    locator:
      strategies:
        - { type: css, value: '.ant-modal-body .ant-form-item:has-text("名称") input' }
    value: "smoke-test-proxy"
    timeout: 3000

  - name: 填写「代理地址」字段
    action: fill
    locator:
      strategies:
        - { type: css, value: '.ant-modal-body .ant-form-item:has-text("代理地址") input' }
        - { type: css, value: '.ant-modal-body .ant-form-item:has-text("地址") input' }
    value: "http://proxy.example.com:8080"
    timeout: 3000

  - name: proxies-modal-filled
    action: screenshot

  - name: 关闭 Modal（点 × 关闭）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-modal-close' }
        - { type: aria, value: "Close" }
    timeout: 3000

  - name: 断言 Modal 关闭（已回到列表页）
    action: assert
    type: visible
    selector: '.page-actions button:has-text("新增代理")'
    timeout: 5000

  # ---- 2. 「探测全部」批量探测 ----
  # 反馈文案由 handleProbeAll 产出（proxies-page.tsx:425）：
  #   `已探测 ${total} 个代理：${ok} 可用 / ${failed} 不可用`
  # 用 CSS :has-text() 子串匹配，同时完成"等待"和"断言"两件事。
  - name: 点击「探测全部」
    action: click
    locator:
      strategies:
        - { type: text, value: "探测全部", match: exact }
        - { type: css, value: '.page-actions button:has-text("探测全部")' }
        - { type: css, value: '.app-content button:has-text("探测全部")' }
    timeout: 8000

  - name: 等批量探测反馈气泡（断言文案含「已探测」）
    action: waitFor
    locator:
      strategies:
        - { type: css, value: '.ant-message-notice-content:has-text("已探测")' }
    timeout: 12000

  - name: proxies-page-end
    action: screenshot

# 期望结果（步数与 steps 逐一对应：14）
expected:
  totalSteps: 14
  maxDuration: 90000