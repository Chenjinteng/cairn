# cairn 镜像列表页 — 真实 GC 场景（破坏性，仅限 dev）
#
# 为什么单独成场景（不并进 delete-real）：
#   runner 的单步硬上限 = runTimeout / max(步数, 5)（runner.js:274）。
#   GC 耗时不可预估，若与删除同场景，GC 的长等会撞单步上限、race reject 直接
#   abort 整个场景（status=errored，该步还不进 steps）—— 删除的证据会一起丢。
#
# 验证的协议事实：「删除 manifest 只解除引用，磁盘空间要 GC 才回收」
#   Pass 1：repos/**/data 里被引用的 digest 集合 live → 删掉 blobs/sha256/**/data 中
#           不被引用的 blob（对应 registry garbage-collect 的等价语义）
#   Pass 2：uploads/**/startedat 超过 24h 的孤立上传会话
#   Pass 3：v0.5.20 起勾选 checkbox 才跑，清掉 0 tag 的仓库目录
#   → 后端 POST /api/gc 返回 {removedBlobs, freedBytes, removedEmptyRepos, emptyRepoFreedBytes}
#
# ⚠️ 覆盖目标（两轮，缺一不可）：
#   第 1 轮：不勾选 checkbox —— 覆盖默认路径 + v0.5.18 P2 回归守卫
#            （旧缺陷：toast 里出现 `undefined` / `NaN`，本轮 evaluate 命中即 throw）
#   第 2 轮：勾选 checkbox —— 覆盖 v0.5.20 新增开关 + v0.5.24 Critical 回归守卫
#            （旧缺陷：勾选后递归删掉整条命名空间，连带 tag 的兄弟仓库一起删）
#
# ⚠️ 文案口径（images-page.tsx:330-341，**半角** 冒号/逗号，与 0.5.18 当时不同）：
#     head    = 'GC 完成:'
#     blobPart= `清理 N 个孤儿 blob,回收 X.XX MiB`（removedBlobs===0 → 不出现）
#     repoPart= `清空 N 个空仓库(a,b)`（未勾选 或 无空仓库 → 不出现）
#     body    = [blobPart, repoPart].join(';') ||
#               (勾选 ? '没有需要清理的孤儿 blob 或空仓库' : '没有需要清理的孤儿 blob')
#   → 旧用例里的全角正则 'GC 完成：…，…' 已失效，是本场景本轮重写的主要原因。
#
# ⚠️ 弹窗文案：Popconfirm title=「确认运行 GC？」、okText=「运行」（无 icon 的 2 汉字 → 插空格 → 「运 行」）。
#    触发按钮 <Button icon={...}>运行 GC</Button> **带 icon** → 不插空格 → 文本是「运行 GC」。
#    弹窗一律加 :not(.ant-popover-hidden) 作用域（关闭后驻留 DOM，runner css 非 strict）。
#
# ⚠️ 破坏性：会真删孤儿 blob；勾选轮还会真删空仓库目录。dev 环境数据不作数（2026-09-27 用户授权）。
#
# ⚠️ evaluate 没有断言能力（runner.js: case 'evaluate' 只 return {status:'passed', result}），
#    一切「等条件」走「脚本内轮询 → 注入 DOM 标记 → assert 读标记」；
#    负向断言（不许出现的东西）内联进 evaluate 的 throw —— throw 会让该步 failed，是硬闸门；
#    出现在脚本里 throw，比「注入标记 + assert」少一步。
#    assert type:text 取 page.textContent 且无等待、默认 exact → 必须显式 match:regex。
#
# 步数 × 时长口径：runner.js:274 `stepTimeoutMs = timeout / max(steps, 5)`，
#   server.js:83 把 timeout 夹到 ≤300000ms。本场景 24 步 → 单步硬上限 12500ms，
#   因此所有显式 timeout ≤10000ms，页内轮询 LIMIT 取 9000ms。
#
# 用法：POST /api/run {scenario: "cairn/gc-real", env: "dev", timeout: 300000}
name: cairn-gc-real
description: |
  真实 GC（dev 专用，破坏性）两轮：
    1. 切到镜像列表 Tab（GC 按钮仅在 allowDelete=true 时渲染）
    2. 记录快照：带 tag 的仓库集合 → DOM 标记 #__gc_before（0.5.24 回归守卫的基线；window.__gcBefore 为冗余副本）
    3. 第 1 轮（不勾选）：点「运行 GC」→ 断言二次确认 → 点「运 行」真跑 →
       轮询快照 toast（evaluate 无断言能力）→ assert match:regex 硬断言形状；
       toast 命中 /undefined|NaN/ 即 throw（v0.5.18 P2 回归守卫）
    4. 第 2 轮（勾选「也清理 0 tag 的仓库」）：断言 checkbox 初始未勾选 →
       点 checkbox → 断言变勾选 → 点「运 行」→ 轮询快照 toast2 → assert 形状
    5. 收尾：对比 __gcBefore，任何带 tag 的仓库消失即 throw（v0.5.24 回归守卫）
  精确数值（removedBlobs / freedMiB / raw）从 steps[].result 读，不写死数字。
env: dev
tags: [destructive, images, gc, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 10000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 10000

  - name: 点击「镜像列表」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像列表", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像列表")' }
    timeout: 8000

  - name: 等待「运行 GC」按钮就绪
    action: assert
    type: visible
    selector: '.app-content button:has-text("运行 GC")'
    timeout: 10000

  # ---- 快照基线（v0.5.24 回归守卫用）----
  # 只取 tagCount>0 的仓库：0 tag 仓库在勾选轮里**本来就该被删**，不能进守卫基线。
  - name: "记录带 tag 仓库快照（注入 #__gc_before）"
    action: evaluate
    script: |
      (async () => {
        const res = await fetch('/api/inventory', { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('inventory HTTP ' + res.status);
        const data = await res.json();
        const repos = ((data && data.data && data.data.repositories) || data.repositories || []);
        const withTags = repos.filter(r => r && r.name && r.tagCount > 0);
        if (!withTags.length) throw new Error('基线为空：没有任何带 tag 的仓库，守卫无意义');
        window.__gcBefore = withTags.map(r => r.name);
        const old = document.getElementById('__gc_before');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__gc_before';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'BEFORE_OK:' + withTags.map(r => r.name + '(' + r.tagCount + ')').join(',') + ':names=' + JSON.stringify(withTags.map(r => r.name));
        document.body.appendChild(d);
        return JSON.stringify({ status: res.status, total: repos.length, withTags: window.__gcBefore });
      })()

  - name: 断言快照已记录
    action: assert
    type: text
    selector: '#__gc_before'
    value: 'BEFORE_OK:'
    match: contains
    timeout: 6000

  # ---- 第 1 轮：不勾选 checkbox（默认路径 + P2 回归守卫）----
  - name: 点击「运行 GC」按钮（第 1 轮）
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-content button:has-text("运行 GC")' }
    timeout: 8000

  - name: 断言「确认运行 GC？」二次确认
    action: assert
    type: visible
    selector: '.ant-popconfirm:not(.ant-popover-hidden):has-text("确认运行 GC？")'
    timeout: 8000

  - name: gc-confirm
    action: screenshot

  - name: 点击「运 行」（第 1 轮，不勾选）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("运 行")' }
    timeout: 8000

  # evaluate 无断言能力（runner.js 的 case 'evaluate' 只 return {status,result}），
  # 所以「等条件」要脚本内轮询 → 结果注入 DOM 标记 → 再由 assert 读标记做硬闸门。
  # assert 的 type:text 走 page.textContent（无等待、默认 exact）→ 必须显式写 match:regex。
  # 另：evaluate 的 step.timeout 被忽略（只受单步 race 罩住），故 LIMIT 自设 9000ms < 13043ms。
  - name: 轮询 GC toast 并注入快照标记（第 1 轮）
    action: evaluate
    script: |
      (() => {
        const LIMIT = 9000, STEP = 200, t0 = Date.now();
        const pick = () => Array.from(document.querySelectorAll('.ant-message-notice-content'))
          .map(el => (el.innerText || '').replace(/\s+/g, ' ').trim())
          .filter(t => t.indexOf('GC 完成') >= 0 || t.indexOf('GC 失败') >= 0);
        const mark = (s) => {
          const old = document.getElementById('__gc_toast');
          if (old) old.remove();
          const el = document.createElement('div');
          el.id = '__gc_toast';
          el.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:0;overflow:hidden;';
          el.textContent = s;
          document.body.appendChild(el);
        };
        return new Promise(resolve => {
          const tick = () => {
            const picks = pick();
            if (picks.length) {
              const raw = picks[picks.length - 1];
              // v0.5.18 P2 回归守卫：旧缺陷把 undefined / NaN 直接拼进 toast
              const bad = raw.match(/undefined|NaN/);
              if (bad) {
                mark('BAD_TOAST:' + raw);
                throw new Error('v0.5.18 P2 回归：GC toast 出现 ' + bad[0] + ' → ' + raw);
              }
              const m = raw.match(/清理\s*(\d+)\s*个孤儿\s*blob,回收\s*([0-9.]+)\s*MiB/);
              mark(raw);
              resolve(JSON.stringify({
                outcome: 'captured',
                elapsedMs: Date.now() - t0,
                raw: raw,
                removedBlobs: m ? Number(m[1]) : null,
                freedMiB: m ? Number(m[2]) : null,
                picks: picks
              }));
              return;
            }
            if (Date.now() - t0 > LIMIT) {
              mark('TIMEOUT_NO_TOAST');
              resolve(JSON.stringify({ outcome: 'timeout', elapsedMs: Date.now() - t0, picks: picks }));
              return;
            }
            setTimeout(tick, STEP);
          };
          tick();
        });
      })()

  # 半角冒号/逗号是实际口径；两种合法形状：有孤儿 blob，或一个都没清到。
  # （第 1 轮不勾选 → 不可能出现「清空 N 个空仓库」，出现反而说明开关失效）
  - name: 断言第 1 轮 toast 形状（半角口径）
    action: assert
    type: text
    selector: '#__gc_toast'
    value: '^GC 完成:(清理 [0-9]+ 个孤儿 blob,回收 [0-9]+\.[0-9]{2} MiB|没有需要清理的孤儿 blob)$'
    match: regex
    timeout: 9000

  - name: gc-after-round1
    action: screenshot

  # ---- 第 2 轮：勾选「也清理 0 tag 的仓库」（v0.5.20 开关 + v0.5.24 守卫）----
  - name: 点击「运行 GC」按钮（第 2 轮）
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-content button:has-text("运行 GC")' }
    timeout: 8000

  - name: 断言第 2 轮二次确认出现
    action: assert
    type: visible
    selector: '.ant-popconfirm:not(.ant-popover-hidden):has-text("确认运行 GC？")'
    timeout: 8000

  # 断言 checkbox 的存在 + 初始未勾选 + 文案含「也清理 0 tag 的仓库」。
  # 文案在 label 上（半角逗号 '目录,不可恢复'），不存在就直接 throw —— 少一步 assert。
  - name: "校验 checkbox 存在且未勾选（注入 #__gc_cb）"
    action: evaluate
    script: |
      (() => {
        const box = document.querySelector('.ant-popconfirm:not(.ant-popover-hidden) .ant-checkbox-wrapper');
        if (!box) throw new Error('第 2 轮弹窗内找不到 .ant-checkbox-wrapper（v0.5.20 开关丢失）');
        const label = (box.innerText || '').replace(/\s+/g, ' ').trim();
        if (label.indexOf('也清理 0 tag 的仓库') < 0) throw new Error('checkbox 文案不含「也清理 0 tag 的仓库」→ ' + label);
        const checked = !!box.querySelector('.ant-checkbox-checked') ||
          !!(box.querySelector('input[type=checkbox]') || {}).checked;
        if (checked) throw new Error('checkbox 初始应为未勾选（第 1 轮未点它），实际已勾选');
        const old = document.getElementById('__gc_cb');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__gc_cb';
        d.style.cssText = 'position:fixed;left:0;bottom:24px;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'CB_OK:' + label + '|checked=' + checked;
        document.body.appendChild(d);
        return JSON.stringify({ label: label, checked: checked });
      })()

  - name: 断言 checkbox 校验通过
    action: assert
    type: text
    selector: '#__gc_cb'
    value: 'CB_OK:'
    match: contains
    timeout: 6000

  - name: 勾选「也清理 0 tag 的仓库」
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-checkbox-wrapper' }
    timeout: 8000

  - name: 断言 checkbox 已勾选
    action: assert
    type: visible
    selector: '.ant-popconfirm:not(.ant-popover-hidden) .ant-checkbox-checked'
    timeout: 8000

  - name: 点击「运 行」（第 2 轮，已勾选）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("运 行")' }
    timeout: 8000

  - name: 轮询 GC toast 并注入快照标记（第 2 轮）
    action: evaluate
    script: |
      (() => {
        const LIMIT = 9000, STEP = 200, t0 = Date.now();
        const pick = () => Array.from(document.querySelectorAll('.ant-message-notice-content'))
          .map(el => (el.innerText || '').replace(/\s+/g, ' ').trim())
          .filter(t => t.indexOf('GC 完成') >= 0 || t.indexOf('GC 失败') >= 0);
        const mark = (s) => {
          const old = document.getElementById('__gc_toast2');
          if (old) old.remove();
          const el = document.createElement('div');
          el.id = '__gc_toast2';
          el.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:0;overflow:hidden;';
          el.textContent = s;
          document.body.appendChild(el);
        };
        return new Promise(resolve => {
          const tick = () => {
            const picks = pick();
            if (picks.length) {
              // 第 2 轮必须取**最新**一条：第 1 轮的 toast 可能还在屏上（message 默认 3s）
              const raw = picks[picks.length - 1];
              const bad = raw.match(/undefined|NaN/);
              if (bad) {
                mark('BAD_TOAST:' + raw);
                throw new Error('v0.5.18 P2 回归：GC toast 出现 ' + bad[0] + ' → ' + raw);
              }
              mark(raw);
              resolve(JSON.stringify({
                outcome: 'captured',
                elapsedMs: Date.now() - t0,
                raw: raw,
                mentionsEmptyRepos: raw.indexOf('清空') >= 0,
                picks: picks
              }));
              return;
            }
            if (Date.now() - t0 > LIMIT) {
              mark('TIMEOUT_NO_TOAST');
              resolve(JSON.stringify({ outcome: 'timeout', elapsedMs: Date.now() - t0, picks: picks }));
              return;
            }
            setTimeout(tick, STEP);
          };
          tick();
        });
      })()

  # 勾选轮合法形状（半角口径）：
  #   有内容  → 'GC 完成:清理 N 个孤儿 blob,回收 X.XX MiB[;清空 N 个空仓库(...)]'
  #             或 'GC 完成:清空 N 个空仓库(...)'
  #   没内容  → 'GC 完成:没有需要清理的孤儿 blob 或空仓库'
  - name: 断言第 2 轮 toast 形状（勾选轮，半角口径）
    action: assert
    type: text
    selector: '#__gc_toast2'
    value: '^GC 完成:(.*清空 [0-9]+ 个空仓库.*|清理 [0-9]+ 个孤儿 blob,回收 [0-9]+\.[0-9]{2} MiB|没有需要清理的孤儿 blob 或空仓库)$'
    match: regex
    timeout: 9000

  - name: gc-after-round2
    action: screenshot

  # ---- v0.5.24 Critical 回归守卫 ----
  # 旧缺陷：勾选「也清理 0 tag 的仓库」后，Pass 3 会连**带 tag 的兄弟仓库**一起递归删掉整条命名空间。
  # 这里对基线做差集：任何 __gcBefore 里的仓库消失 → throw（该步 failed，场景不通过）。
  - name: 回归守卫：勾选 GC 不得删掉带 tag 的仓库
    action: evaluate
    script: |
      (async () => {
        const res = await fetch('/api/inventory', { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('inventory HTTP ' + res.status);
        const json = await res.json();
        const payload = (json && json.data) ? json.data : json;
        const repos = (payload && payload.repositories) || [];
        const nowWithTags = new Set(repos.filter(r => r && r.name && r.tagCount > 0).map(r => r.name));
        const bEl = document.getElementById('__gc_before');
        const bRaw = bEl ? (bEl.textContent || '') : '';
        const bIdx = bRaw.indexOf(':names=');
        if (bIdx < 0) throw new Error('守卫基线丢失：未读到 #__gc_before 的 :names=');
        let before;
        try { before = JSON.parse(bRaw.slice(bIdx + ':names='.length)); } catch (e) { throw new Error('守卫基线解析失败: ' + e.message); }
        if (!Array.isArray(before) || !before.length) throw new Error('守卫基线为空');
        const missing = before.filter(n => !nowWithTags.has(n));
        const old = document.getElementById('__gc_guard');
        if (old) old.remove();
        if (missing.length) {
          throw new Error('v0.5.24 回归：勾选 GC 后仍带 tag 的仓库消失 → ' + missing.join(','));
        }
        const d = document.createElement('div');
        d.id = '__gc_guard';
        d.style.cssText = 'position:fixed;left:0;bottom:36px;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'GUARD_OK:before=' + before.length + ' now=' + nowWithTags.size;
        document.body.appendChild(d);
        return JSON.stringify({
          beforeCount: before.length,
          nowWithTags: Array.from(nowWithTags),
          missing: missing,
          allRepos: repos.map(r => ({ name: r.name, tagCount: r.tagCount }))
        });
      })()

# 期望结果（步数与 steps 逐一对应：24）
expected:
  totalSteps: 24
  maxDuration: 300000