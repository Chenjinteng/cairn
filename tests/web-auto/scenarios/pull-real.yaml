# cairn 镜像拉取 — 真实拉取端到端（破坏性：会在 158 嵌入式 registry 新增 webauto-pull/busybox）
#
# 与 pull-page.yaml 的分工：那个是只读场景（刻意不点「加入队列」）；本场景真的入队，
# 真的把 proxy.example.com:10001 的 busybox:latest 复制进 158 的嵌入式 registry。
#
# 源镜像名只填一个字段 `proxy.example.com:10001/busybox:latest`：
#   走 utils.ts 的 inferProtocol 主机前缀推断（带端口且非 443/8443/5000 → http），
#   得到 sourceUrl=http://proxy.example.com:10001、sourceRef=busybox:latest。
#   同一条步骤顺带覆盖「主机前缀解析」路径，不展开高级选项手填来源地址。
#
# 目标镜像名显式填 webauto-pull/busybox:latest：独立仓库，便于随后按 digest 删除 + GC 对比磁盘。
#
# 预览 Modal 的三条源码事实（pull-page.tsx:1095-1111 / 1232-1251）：
#   1. 是普通 <Modal>（不是 Modal.confirm）→ 按钮在 .ant-modal-footer 内，OK 即 .ant-btn-primary；
#      且带 destroyOnClose，关闭后不留残留 DOM，无需 :not(.ant-popover-hidden) 作用域。
#   2. okText="确认入队"（4 字）/ cancelText="再改改"（3 字）→ antd autoInsertSpace 只对
#      无 icon 的 2 汉字串生效，这两颗按钮不插空格。
#   3. probeResult.state 为 loading / failed 时 okButtonProps.disabled=true → 按钮带 disabled
#      属性。必须先等预检结论 Alert 出现再点，否则点不动（提示语见 :1246-1250）。
#
# 步数 × 时长口径：runner.js:274 `stepTimeoutMs = timeout / max(steps, 5)`，
# server.js:83 把 timeout 夹到 ≤300000ms。本场景 14 步 → 单步硬上限 21428ms，
# 因此所有显式 timeout 一律 ≤15000ms；「等拉取完成」不靠单步长等，而靠
# evaluate 在页内轮询 + 随后的 visible 断言叠加两段预算。
name: cairn-pull-real
description: |
  真实拉取端到端（破坏性，会新增镜像）：
    1. 打开首页 → 切「镜像拉取」Tab
    2. 源镜像名填 proxy.example.com:10001/busybox:latest（覆盖 inferProtocol 主机前缀推断）
    3. 目标镜像名填 webauto-pull/busybox:latest（独立仓库，便于后续删除/GC）
    4. 点「加入队列」→ 等预览 Modal → 等预检结论「源镜像可拉取」出现
    5. 点「确认入队」真正入队
    6. 页内轮询「目标仓库那一行」的任务状态直到出现终态，记录经历过的阶段
    7. 断言「目标仓库那一行」显示「已完成」
       必须按行作用域：历史表里已有别的「已完成」行，扫整页会假阳性
env: dev
tags: [destructive, pull, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 15000

  - name: 点击「镜像拉取」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像拉取", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像拉取")' }
    timeout: 8000

  - name: 等待拉取表单渲染
    action: assert
    type: visible
    selector: '.app-content input[placeholder="alpine:3.19"], input[placeholder="alpine:3.19"]'
    timeout: 15000

  - name: 源镜像名填内网源 busybox:latest
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder="alpine:3.19"]' }
        - { type: css, value: 'input[placeholder="alpine:3.19"]' }
    value: "proxy.example.com:10001/busybox:latest"
    timeout: 5000

  - name: 目标镜像名填 webauto-pull/busybox:latest
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder="与源镜像同名"]' }
        - { type: css, value: 'input[placeholder="与源镜像同名"]' }
    value: "webauto-pull/busybox:latest"
    timeout: 5000

  - name: 点击「加入队列」打开预览 Modal
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-content button:has-text("加入队列")' }
        - { type: css, value: 'button:has-text("加入队列")' }
    timeout: 8000

  - name: 等待预览 Modal 出现
    action: waitFor
    locator:
      strategies:
        - { type: css, value: '.ant-modal:has-text("即将创建拉取任务")' }
    timeout: 12000

  # 预检成功才会渲染这句（pull-page.tsx:1246-1249）；预检失败会渲染「源端预检未通过」，
  # 此时本步会超时失败 —— 失败截图即为「预检为什么没过」的取证。
  - name: 等待预检结论「源镜像可拉取」
    action: assert
    type: visible
    selector: '.ant-modal:has-text("源镜像可拉取")'
    timeout: 15000

  - name: 点击「确认入队」
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-modal-footer button.ant-btn-primary' }
        - { type: css, value: 'button:has-text("确认入队")' }
    timeout: 8000

  # 单步硬上限 21428ms → 页内轮询预算 15000ms。
  # 不用 fetch 探针，纯读 DOM：终态文案取自 STATUS_META（pull-page.tsx:166-175）。
  # 轮询与断言都限定在目标行（tr.ant-table-row:has-text("webauto-pull/busybox")）内。
  - name: 页内轮询任务状态至终态
    action: evaluate
    script: |
      (async () => {
        const t0 = Date.now();
        const LIMIT = 15000;
        const TERM = ['已完成', '失败', '已取消'];
        const STATUS = ['排队中', '拉取中'];
        const phases = [];
        let last = '';
        let rows = 0;
        // 只在「目标仓库 = webauto-pull/busybox」那一行内判终态：
        // 历史表里已有别的已完成行，扫整页会在第一帧就命中（假阳性）。
        const pick = () => {
          const all = Array.from(document.querySelectorAll('.app-content tr.ant-table-row'));
          rows = all.length;
          return all.find(r => (r.innerText || '').indexOf('webauto-pull/busybox') >= 0) || null;
        };
        while (Date.now() - t0 < LIMIT) {
          const row = pick();
          last = row ? (row.innerText || '').replace(/\s+/g, ' ').slice(0, 400) : '';
          if (row) {
            for (const w of STATUS) {
              if (last.indexOf(w) >= 0 && phases.indexOf(w) < 0) phases.push(w);
            }
            for (const w of TERM) {
              if (last.indexOf(w) >= 0) {
                return JSON.stringify({ outcome: 'settled', terminal: w, phases: phases, elapsedMs: Date.now() - t0, rows: rows, text: last });
              }
            }
          }
          await new Promise(r => setTimeout(r, 250));
        }
        return JSON.stringify({ outcome: 'timeout', phases: phases, elapsedMs: Date.now() - t0, rows: rows, text: last });
      })()

  - name: 断言任务行显示「已完成」
    action: assert
    type: visible
    selector: '.app-content tr.ant-table-row:has-text("webauto-pull/busybox"):has-text("已完成")'
    timeout: 15000

  - name: pull-real-terminal
    action: screenshot

  - name: pull-real-end
    action: screenshot

# 期望结果（步数与 steps 逐一对应：14）
expected:
  totalSteps: 14
  maxDuration: 300000
