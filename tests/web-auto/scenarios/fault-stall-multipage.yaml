# cairn 故障注入（多页版）— 后端 hang 住时，4 个「快档」页面是否都在 ≤10s 给出错误态
#
# 与 fault-timeout.yaml 的区别：那一版只证到 1 个页面（镜像拉取），本版在**同一次冻结**内
# 串行覆盖 4 个页面：镜像热度 / 镜像拉取 / 凭据管理 / 代理管理。
#
# 为什么是这 4 页（其余 2 页为什么不在此列）：
#   * 镜像列表 images-page：mount 时 `if (!inventory) void load(false)`（images-page.tsx:109-115），
#     inventory 已由 App 启动时缓存 ⇒ remount 根本不发请求；它唯一的错误源是 load() 的
#     `/api/inventory`，走**慢档 120s**（api.ts:57）⇒ 该页在结构上不可能 ≤10s 出错误态。
#   * 设置 settings-page：mount effect（settings-page.tsx:257-272）两路请求失败**静默丢弃**
#     （无 setError）⇒ 无失败渲染路径，压根不会出现错误态。
#   结论：本场景覆盖 4/6 页；另 2 页按源码设计不产生错误态 —— 这一点在验收报告里如实声明，
#   不当作「通过」。
#
# 注入手法：`docker pause cairn`（内核仍在 listen、TCP 仍能建连，但没有 HTTP 回应）
#   ⇒ 正确归档为 TIMEOUT，而不是 NETWORK_ERROR（用 docker stop 会 RST/拒连，归档错误）。
#
# 时序预算（t=0 为本场景步 4 发出同步请求的时刻）：
#   t+1.0s relay 命中日志 → pause
#   t+1.6s 步 5 探针判定 PAUSED
#   t+2.0s 切「镜像热度」   → 五路并发（快档 10s）→ 错误态 ≈ t+12.0
#   t+12.4s 切「镜像拉取」 → listPullJobs()（快档 10s）→ 错误态 ≈ t+22.4
#   t+22.7s 切「凭据管理」 → listCredentials()（快档 10s）→ 错误态 ≈ t+32.7
#   t+33.0s 切「代理管理」 → listProxies()（快档 10s）→ 错误态 ≈ t+43.0
#   t+53.2s relay 结束 52s 冻结 → unpause
#   t+54.7s 步 15 探针判定 RECOVERED
#   冻结 52s 的两个约束：必须 > 第 4 页错误态出现的 t+43.0（否则页面成功、断言落空）；
#   又必须让步 15 的恢复探针仍在单步硬上限内看到恢复。步 16 时单步硬上限
#   = 300000/16 = 18750ms（runner.js:274），故步 15 显式 timeout 取 18000、页内 LIMIT 17000。
#
# 断言口径：错误分类必须是 TIMEOUT；页内计时必须落在 [8000, 11500] ms
#   —— 下限排除「立刻失败」（那是 NETWORK_ERROR），上限排除「没走满 10s 预算」。
#
# —— 与 158 侧的同步（关键设计）——
# cairn 的 slogLogger（api.go:54 挂在根 router 上，覆盖 SPA catch-all）对每个请求打一行
# {"msg":"http","path":…}。于是 158 上先起一个 relay（setsid nohup）：
#   timeout 60 docker logs -f --tail 3 cairn | grep -q -m1 __fi_stall_probe_b7d4e1
#   → 命中即 docker pause cairn → sleep 52 → docker unpause cairn
# 本场景步 4 请求唯一路径 /<TOKEN> 把它写进容器日志，relay 立刻冻结容器。
# TOKEN 必须与 relay 中的完全一致；重跑前必须确认日志里没有同名历史行。
name: cairn-fault-stall-multipage
description: |
  故障注入（多页覆盖面）：一次 docker pause 冻结 52s，同一次冻结内串行覆盖 4 个「快档」页面，
  逐页验证「后端 hang 住 ⇒ ≤10s 出现错误态，且错误分类为 TIMEOUT」。
    1. 打开首页 → 断言镜像列表已有行（基线：注入前后端确实是活的）
    2. 请求唯一标记路径 → 158 侧 relay 从容器日志命中后 docker pause cairn
    3. 页内探针确认已 PAUSED（连续 2 次 /healthz 在 400ms 内被 abort）
    4. 依次切「镜像热度」「镜像拉取」「凭据管理」「代理管理」四个 Tab，
       每页轮询其错误态出现并计时（4 页串行，全程容器保持冻结）
    5. 聚合断言：4 页全部 found=true、页内计时落在 8~11.5s、错误分类均为 TIMEOUT
    6. 等 relay unpause → 探针确认 RECOVERED
  未覆盖：镜像列表（remount 不发请求、唯一错误源走慢档 120s）与设置（无失败渲染路径）。
env: dev
tags: [fault-injection, multi-page, timeout-budget, cairn, resilience]
target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 15000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 12000

  # 基线：镜像列表已有行 ⇒ 注入前 /api/inventory 是通的（后端活着）。
  - name: 基线断言镜像列表已有数据行
    action: assert
    type: visible
    selector: '.app-content tr.ant-table-row'
    timeout: 12000

  # 同步点：请求唯一路径 → 容器日志出现该行 → 158 侧 relay 命中并 pause。
  # 本步同时初始化页内结果数组。fetch 自带 3000ms abort：
  # 若 relay 恰好在响应写出前冻结容器，本步最多也只花 3s（不能让同步点自己顶穿单步上限）。
  - name: 打故障注入标记（容器日志同步点）
    action: evaluate
    script: |
      (async () => {
        const T = '__fi_stall_probe_b7d4e1';
        window.__fi_r = [];
        window.__fi_state = 'INIT';
        let markerStatus = 'none';
        try {
          const r = await fetch('/' + T + '?ts=' + Date.now(), {
            cache: 'no-store',
            signal: AbortSignal.timeout(3000),
          });
          markerStatus = String(r.status);
        } catch (e) {
          markerStatus = 'ERR:' + String((e && e.name) || e);
        }
        window.__fi_marker = markerStatus;
        return JSON.stringify({ step: 'marker', token: T, markerStatus: markerStatus });
      })()

  - name: 页内探针确认容器已 PAUSED
    action: evaluate
    script: |
      (async () => {
        const LIMIT = 9000;
        const t0 = Date.now();
        let fails = 0, oks = 0, probes = 0, state = 'ALIVE';
        const probe = async () => {
          probes++;
          try {
            const r = await fetch('/healthz?ts=' + Math.random(), {
              signal: AbortSignal.timeout(400),
              cache: 'no-store',
            });
            return r.ok;
          } catch (e) {
            return false;
          }
        };
        while (Date.now() - t0 < LIMIT) {
          const ok = await probe();
          if (ok) { oks++; fails = 0; } else { fails++; oks = 0; }
          if (fails >= 2) { state = 'PAUSED'; break; }
          await new Promise((r) => setTimeout(r, 120));
        }
        window.__fi_state = state;
        if (state !== 'PAUSED') {
          throw new Error('container not frozen: state=' + state + ' probes=' + probes + ' elapsed=' + (Date.now() - t0));
        }
        return JSON.stringify({ step: 'pause-detect', state: state, probes: probes, elapsedMs: Date.now() - t0 });
      })()
    timeout: 14000

  # ---------- 第 1 页：镜像热度（五路并发，全走快档 10s）----------
  - name: 切到「镜像热度」
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像热度")' }
        - { type: text, value: "镜像热度", match: exact }
    timeout: 8000

  - name: 页内轮询「镜像热度」错误态并计时
    action: evaluate
    script: |
      (async () => {
        const LIMIT = 14000;
        const t0 = Date.now();
        let found = false, elapsed = -1, text = '', code = '';
        const pick = () =>
          Array.from(document.querySelectorAll('.ant-alert')).find(
            (a) => (a.innerText || '').indexOf('错误分类：') >= 0
          ) || null;
        while (Date.now() - t0 < LIMIT) {
          const a = pick();
          if (a) {
            text = (a.innerText || '').replace(/\s+/g, ' ').trim();
            const m = text.match(/错误分类：\s*([A-Za-z_0-9]+)/);
            code = m ? m[1] : '';
            elapsed = Date.now() - t0;
            found = true;
            break;
          }
          await new Promise((r) => setTimeout(r, 120));
        }
        const within = found && elapsed >= 8000 && elapsed <= 11500;
        window.__fi_r = window.__fi_r || [];
        window.__fi_r[0] = { page: 'stats', found: found, elapsedMs: elapsed, within: within, code: code, text: text };
        return JSON.stringify(window.__fi_r[0]);
      })()
    timeout: 16000

  # ---------- 第 2 页：镜像拉取（listPullJobs，快档 10s）----------
  - name: 切到「镜像拉取」
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像拉取")' }
        - { type: text, value: "镜像拉取", match: exact }
    timeout: 8000

  - name: 页内轮询「镜像拉取」错误态并计时
    action: evaluate
    script: |
      (async () => {
        const LIMIT = 14000;
        const t0 = Date.now();
        let found = false, elapsed = -1, text = '', code = '';
        const pick = () =>
          Array.from(document.querySelectorAll('.ant-alert')).find(
            (a) => (a.innerText || '').indexOf('错误分类：') >= 0
          ) || null;
        while (Date.now() - t0 < LIMIT) {
          const a = pick();
          if (a) {
            text = (a.innerText || '').replace(/\s+/g, ' ').trim();
            const m = text.match(/错误分类：\s*([A-Za-z_0-9]+)/);
            code = m ? m[1] : '';
            elapsed = Date.now() - t0;
            found = true;
            break;
          }
          await new Promise((r) => setTimeout(r, 120));
        }
        const within = found && elapsed >= 8000 && elapsed <= 11500;
        window.__fi_r = window.__fi_r || [];
        window.__fi_r[1] = { page: 'pull', found: found, elapsedMs: elapsed, within: within, code: code, text: text };
        return JSON.stringify(window.__fi_r[1]);
      })()
    timeout: 16000

  # ---------- 第 3 页：凭据管理（listCredentials，快档 10s）----------
  - name: 切到「凭据管理」
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("凭据管理")' }
        - { type: text, value: "凭据管理", match: exact }
    timeout: 8000

  - name: 页内轮询「凭据管理」错误态并计时
    action: evaluate
    script: |
      (async () => {
        const LIMIT = 14000;
        const t0 = Date.now();
        let found = false, elapsed = -1, text = '', code = '';
        const pick = () =>
          Array.from(document.querySelectorAll('.ant-alert')).find(
            (a) => (a.innerText || '').indexOf('错误分类：') >= 0
          ) || null;
        while (Date.now() - t0 < LIMIT) {
          const a = pick();
          if (a) {
            text = (a.innerText || '').replace(/\s+/g, ' ').trim();
            const m = text.match(/错误分类：\s*([A-Za-z_0-9]+)/);
            code = m ? m[1] : '';
            elapsed = Date.now() - t0;
            found = true;
            break;
          }
          await new Promise((r) => setTimeout(r, 120));
        }
        const within = found && elapsed >= 8000 && elapsed <= 11500;
        window.__fi_r = window.__fi_r || [];
        window.__fi_r[2] = { page: 'credentials', found: found, elapsedMs: elapsed, within: within, code: code, text: text };
        return JSON.stringify(window.__fi_r[2]);
      })()
    timeout: 16000

  # ---------- 第 4 页：代理管理（listProxies，快档 10s）----------
  - name: 切到「代理管理」
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("代理管理")' }
        - { type: text, value: "代理管理", match: exact }
    timeout: 8000

  - name: 页内轮询「代理管理」错误态并计时
    action: evaluate
    script: |
      (async () => {
        const LIMIT = 14000;
        const t0 = Date.now();
        let found = false, elapsed = -1, text = '', code = '';
        const pick = () =>
          Array.from(document.querySelectorAll('.ant-alert')).find(
            (a) => (a.innerText || '').indexOf('错误分类：') >= 0
          ) || null;
        while (Date.now() - t0 < LIMIT) {
          const a = pick();
          if (a) {
            text = (a.innerText || '').replace(/\s+/g, ' ').trim();
            const m = text.match(/错误分类：\s*([A-Za-z_0-9]+)/);
            code = m ? m[1] : '';
            elapsed = Date.now() - t0;
            found = true;
            break;
          }
          await new Promise((r) => setTimeout(r, 120));
        }
        const within = found && elapsed >= 8000 && elapsed <= 11500;
        window.__fi_r = window.__fi_r || [];
        window.__fi_r[3] = { page: 'proxies', found: found, elapsedMs: elapsed, within: within, code: code, text: text };
        return JSON.stringify(window.__fi_r[3]);
      })()
    timeout: 16000

  # 聚合断言：4 页一个都不能少，且每页 found && within && code===TIMEOUT，否则本步失败。
  # 放在 evaluate 里 throw（runner.js:167-176 会把抛错判为 failed 并自动截失败图），
  # 这样 4 页只需 1 步，把步数留给单步硬上限。
  - name: 聚合断言 4 页错误态均落在 10s 预算内且分类为 TIMEOUT
    action: evaluate
    script: |
      (async () => {
        const items = (window.__fi_r || []).filter(Boolean);
        const summary = {
          step: 'aggregate',
          count: items.length,
          pages: items.map((x) => ({ page: x.page, found: x.found, elapsedMs: x.elapsedMs, within: x.within, code: x.code })),
        };
        if (items.length !== 4) {
          throw new Error('expected 4 page results, got ' + items.length + ' :: ' + JSON.stringify(summary));
        }
        const bad = items.filter((x) => !(x.found && x.within && x.code === 'TIMEOUT'));
        if (bad.length) {
          throw new Error('pages not conforming: ' + JSON.stringify(bad) + ' :: all=' + JSON.stringify(summary));
        }
        return JSON.stringify(summary);
      })()

  - name: 页内探针等待容器 RECOVERED
    action: evaluate
    script: |
      (async () => {
        const LIMIT = 17000;
        const t0 = Date.now();
        let oks = 0, probes = 0, state = 'STILL_PAUSED';
        while (Date.now() - t0 < LIMIT) {
          probes++;
          let ok = false;
          try {
            const r = await fetch('/healthz?ts=' + Math.random(), {
              signal: AbortSignal.timeout(600),
              cache: 'no-store',
            });
            ok = r.ok;
          } catch (e) {
            ok = false;
          }
          if (ok) { oks++; } else { oks = 0; }
          if (oks >= 2) { state = 'RECOVERED'; break; }
          await new Promise((r) => setTimeout(r, 150));
        }
        window.__fi_state = state;
        if (state !== 'RECOVERED') {
          throw new Error('backend did not recover within ' + LIMIT + 'ms: probes=' + probes);
        }
        return JSON.stringify({ step: 'recover-detect', state: state, probes: probes, elapsedMs: Date.now() - t0 });
      })()
    timeout: 18000

  - name: fault-stall-multipage-end
    action: screenshot

# 期望结果（步数与 steps 逐一对应：16）
expected:
  totalSteps: 16
  maxDuration: 300000
