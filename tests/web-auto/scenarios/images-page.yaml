# cairn 镜像列表页 — 深度场景
#
# 覆盖：搜索过滤、查看详情 Drawer、删除确认弹窗、运行 GC 弹窗
# 注：删除 / GC 都有二次确认，不会真发请求
#
# 用法：POST /api/run {scenario: "cairn/images-page", env: "dev"}
name: cairn-images-page
description: |
  镜像列表页深度交互：
    1. 切到镜像列表 Tab
    2. 输入搜索词，确认表格过滤生效
    3. 打开第一个仓库的详情 Drawer
    4. 关闭 Drawer
    5. 触发"删除仓库"二次确认弹窗并取消（不真删）
    6. 触发"运行 GC"二次确认弹窗并取消（不真跑）
env: dev
tags: [medium, images, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: on-failure
  trace: on-failure
  video: never
  har: never

steps:
  # ---- 0. 导航到镜像列表 ----
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 15000

  - name: 点击「镜像列表」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像列表", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像列表")' }
    timeout: 8000

  - name: 等待列表渲染
    action: assert
    type: visible
    selector: '.app-content input[placeholder*="搜索"], .app-content .ant-table, .app-content .ant-empty'
    timeout: 15000

  # ---- 1. 搜索过滤 ----
  - name: 在搜索框输入「library」
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder*="搜索"]' }
    value: "library"
    timeout: 5000

  - name: 等表格响应搜索（重查 inventory）
    action: waitFor
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row, .app-content .ant-empty' }
    timeout: 10000

  - name: 截取搜索后状态
    action: screenshot
    name: images-after-search

  - name: 清空搜索框
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder*="搜索"]' }
    value: ""

  # ---- 2. 打开详情 Drawer（如果有数据） ----
  # 用 click 直接尝试点「详情」链接；如果表格空则找不到元素，会 timeout——所以包到 include 里
  # 跑通后保留为正常步骤；空表时 runner 会报失败，由用户判断是否接受
  - name: 点击第一行的「详情」链接
    action: click
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row:first-child button:has-text("详情")' }
        - { type: css, value: 'table tbody tr.ant-table-row:first-child button.ant-btn-link' }
    timeout: 5000

  - name: 断言详情 Drawer 打开
    action: assert
    type: visible
    selector: '.ant-drawer-open .ant-drawer-content, .ant-drawer-content-wrapper'
    timeout: 8000

  - name: 关闭 Drawer
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-drawer-close' }
        - { type: aria, value: "Close" }
    timeout: 3000

  # ---- 3. 删除确认弹窗（不真删） ----
  - name: 点击第一行「删除」按钮
    action: click
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row:first-child button.ant-btn-dangerous' }
        - { type: css, value: 'table tbody tr.ant-table-row:first-child .ant-btn .anticon-delete' }
    timeout: 5000

  - name: 断言「确认删除」弹窗出现
    action: assert
    type: visible
    selector: '.ant-modal-confirm .ant-modal-confirm-title, .ant-popconfirm'
    timeout: 5000

  - name: 点击「取消」
    action: click
    locator:
      strategies:
        - { type: text, value: "取消", match: exact }
        - { type: css, value: '.ant-modal-confirm-btns button:has-text("取消"), .ant-popconfirm-buttons .ant-btn:has-text("取消")' }
    timeout: 3000

  # ---- 4. GC 确认弹窗（不真跑） ----
  - name: 点击「运行 GC」按钮
    action: click
    locator:
      strategies:
        - { type: text, value: "运行 GC", match: contains }
        - { type: css, value: '.app-content button:has-text("运行 GC")' }
    timeout: 5000

  - name: 断言「确认运行 GC」弹窗
    action: assert
    type: visible
    selector: '.ant-modal-confirm-title, .ant-popconfirm .ant-popover-inner'
    timeout: 5000

  - name: 点击「取消」
    action: click
    locator:
      strategies:
        - { type: text, value: "取消", match: exact }
        - { type: css, value: '.ant-modal-confirm-btns button:has-text("取消"), .ant-popconfirm button:has-text("取消")' }
    timeout: 3000

  - name: images-page-end
    action: screenshot

# 期望结果
expected:
  totalSteps: 17
  maxDuration: 90000