# cairn 镜像列表页 — 深度场景
#
# 覆盖：搜索过滤、删除仓库二次确认弹窗、运行 GC 二次确认弹窗
# 注：删除 / GC 都停在二次确认的「取 消」上，不会真发请求
#
# ⚠️ 关于「取 消」中间的空格（不是笔误）
#   antd 5.x 的 <Button> 默认 autoInsertSpace=true：两个汉字构成的按钮文本会被拆成
#   "取" + " " + "消"（Button 子节点包 <span>）。ConfigProvider 未显式关闭该行为
#   （web/src/main.tsx 的 ConfigProvider 只设了 theme / locale）。
#   因此 DOM 文本是「取 消」，`text: "取消", match: exact` 永远匹配不上。
#   该机制**只作用于 Button 组件**；Radio.Button / Tag / Collapse label 不插空格。
#   已由 settings-page 场景 19/19 通过实测反向确认。
#
# 使用「取 消」的等价 CSS 锚点优先，text 策略兜底：
#   优先 .ant-popconfirm-buttons（Popconfirm 的按钮区）
#
# ⚠️ 弹窗类定位一律加 :not(.ant-popover-hidden) 作用域（2026-09-27 探针实测）
#   antd 关闭 Popconfirm 后节点不销毁：旧弹窗继续留在 DOM 里（离场动画期间
#   连 .ant-popover-hidden 都还没加上），只是 display:none。
#   而 Playwright 的 page.click 与 waitForSelector(state=visible) 均为「非 strict，
#   取 DOM 顺序第一个匹配」；一旦先后开过两个 Popconfirm，第二次的断言/点击
#   就会命中那个隐藏的旧弹窗 → 一直等到超时。
#   探针 candidateCounts 实测：加作用域后 popconfirmNotHiddenInner=1，唯一解。
#   本场景判据同时收紧为按钮文案（删 除 / 运 行），以区分两个弹窗。
#
# 用法：POST /api/run {scenario: "cairn/images-page", env: "dev"}
name: cairn-images-page
description: |
  镜像列表页深度交互：
    1. 切到镜像列表 Tab
    2. 输入搜索词，确认表格重新查询
    3. 清空搜索框
    4. 触发"删除仓库"二次确认弹窗并取消（不真删）
    5. 触发"运行 GC"二次确认弹窗并取消（不真跑）
env: dev
tags: [medium, images, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: on-failure
  trace: on-failure
  video: never
  har: never

steps:
  # ---- 0. 导航到镜像列表 ----
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 15000

  - name: 点击「镜像列表」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像列表", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像列表")' }
    timeout: 8000

  - name: 等待列表渲染
    action: assert
    type: visible
    selector: '.app-content input[placeholder*="搜索"], .app-content .ant-table, .app-content .ant-empty'
    timeout: 15000

  # ---- 1. 搜索过滤 ----
  - name: 在搜索框输入「library」
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder*="搜索"]' }
    value: "library"
    timeout: 5000

  - name: 等表格响应搜索（重查 inventory）
    action: waitFor
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row, .app-content .ant-empty' }
    timeout: 10000

  - name: images-after-search
    action: screenshot

  - name: 清空搜索框
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder*="搜索"]' }
    value: ""

  # ---- 2. 删除二次确认（依赖有数据） ----
  # dev 158 上确认有镜像行（第二轮复跑该步 passed），因此这里直接点；
  # 空表环境会在本步报 timeout —— 属预期，不是 App 缺陷。

  - name: 点击第一行「删除」按钮（如有数据）
    action: click
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row button.ant-btn-dangerous' }
    timeout: 5000

  - name: 断言「确认删除」弹窗出现
    action: assert
    type: visible
    # 非隐藏作用域 + 按钮文案判据：排除先前取消、仍驻留 DOM 的旧弹窗
    selector: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("删 除"), .ant-modal-confirm-title'
    timeout: 5000

  - name: 点击「取 消」（不真删）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("取 消")' }
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons .ant-btn-default' }
        - { type: text, value: "取 消", match: exact }
        - { type: text, value: "取消", match: exact }
    timeout: 5000

  # ---- 3. GC 确认弹窗（不真跑） ----
  - name: 点击「运行 GC」按钮
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-content button:has-text("运行 GC")' }
        - { type: text, value: "运行 GC", match: contains }
    timeout: 5000

  - name: 断言「确认运行 GC」弹窗
    action: assert
    type: visible
    # 此处 DOM 里已有 2 枚 popconfirm（旧的删除弹窗隐藏驻留），必须加作用域
    selector: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("运 行"), .ant-modal-confirm-title'
    timeout: 5000

  - name: 点击「取 消」（不真跑 GC）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("取 消")' }
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons .ant-btn-default' }
        - { type: text, value: "取 消", match: exact }
        - { type: text, value: "取消", match: exact }
    timeout: 5000

  - name: images-page-end
    action: screenshot

# 期望结果（步数与 steps 逐一对应：15）
expected:
  totalSteps: 15
  maxDuration: 90000