# cairn 镜像列表页 — 深度场景
#
# 覆盖：搜索过滤、行内操作列契约（v0.5.29 之后只剩「详情」）、详情抽屉可打开、
#       运行 GC 二次确认弹窗（停在「取 消」上，不真跑）
#
# ⚠️ v0.5.29 变更（本场景 2026-09-28 第 3 次改写的原因）
#   0.5.29「镜像列表页去掉行内删除仓库入口」把操作列收敛为仅保留「详情」按钮
#   （web/src/pages/images-page.tsx:229-241，源码注释明确记录该决策）。原场景步 9~11
#   依赖 `table tbody tr.ant-table-row button.ant-btn-dangerous` 触发「删除仓库」
#   Popconfirm —— 该按钮已不存在，于是步 9 `Locator not found`，步 10~15 全部未执行。
#   改写原则：不把过时断言当产品缺陷上报；改为「负向回归守卫（入口确实已下线）+
#   正向验证（保留下来的『详情』入口确实能用）」。
#
# ⚠️ 关于「取 消」中间的空格（不是笔误）
#   antd 5.x 的 <Button> 默认 autoInsertSpace=true：两个汉字构成的按钮文本会被拆成
#   "取" + " " + "消"（Button 子节点包 <span>）。ConfigProvider 未显式关闭该行为
#   （web/src/main.tsx 的 ConfigProvider 只设了 theme / locale）。
#   因此 DOM 文本是「取 消」，`text: "取消", match: exact` 永远匹配不上。
#   该机制**只作用于 Button 组件**；Radio.Button / Tag / Collapse label 不插空格。
#   已由 settings-page 场景 19/19 通过实测反向确认。
#
# 使用「取 消」的等价 CSS 锚点优先，text 策略兜底：
#   优先 .ant-popconfirm-buttons（Popconfirm 的按钮区）
#
# ⚠️ 弹窗类定位一律加 :not(.ant-popover-hidden) 作用域（2026-09-27 探针实测）
#   antd 关闭 Popconfirm 后节点不销毁：旧弹窗继续留在 DOM 里（离场动画期间
#   连 .ant-popover-hidden 都还没加上），只是 display:none。
#   而 Playwright 的 page.click 与 waitForSelector(state=visible) 均为「非 strict，
#   取 DOM 顺序第一个匹配」；一旦先后开过两个 Popconfirm，第二次的断言/点击
#   就会命中那个隐藏的旧弹窗 → 一直等到超时。
#   探针 candidateCounts 实测：加作用域后 popconfirmNotHiddenInner=1，唯一解。
#   本场景判据同时收紧为按钮文案（运 行），以区分不同弹窗。
#
# run_action 注意：runner.js 的 action 只有 goto/fill/click/waitFor/assert/screenshot/
#   evaluate/include，**没有 check**；但本场景不需要勾选框（勾选版在 gc-real 覆盖）。
#
# 步数 × 时长口径：runner.js `stepTimeoutMs = timeout / max(steps, 5)`，
#   server.js:83 把 timeout 夹到 ≤300000ms。本场景 16 步 → 单步硬上限 18750ms，
#   因此所有显式 timeout 一律 ≤12000ms。
#
# 用法：POST /api/run {scenario: "cairn/images-page", env: "dev", timeout: 300000}
name: cairn-images-page
description: |
  镜像列表页深度交互（v0.5.29 口径）：
    1. 切到镜像列表 Tab → 输入/清空搜索词，确认表格重新查询
    2. 负向回归守卫：断言操作列已无「删除仓库」入口(dangerous 按钮数=0)，
       且每一行都保留「详情」入口 —— 若哪天误把删除入口加回来，本步会炸
    3. 点第一行「详情」，断言详情抽屉真的打开（标题 + Descriptions 均就位）
    4. 关闭抽屉
    5. 触发"运行 GC"二次确认弹窗并取消（不真跑 GC）
env: dev
tags: [medium, images, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  # ---- 0. 导航到镜像列表 ----
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 15000

  - name: 点击「镜像列表」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像列表", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像列表")' }
    timeout: 8000

  - name: 等待列表渲染
    action: assert
    type: visible
    selector: '.app-content input[placeholder*="搜索"], .app-content .ant-table, .app-content .ant-empty'
    timeout: 15000

  # ---- 1. 搜索过滤 ----
  - name: 在搜索框输入「library」
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder*="搜索"]' }
    value: "library"
    timeout: 5000

  - name: 等表格响应搜索（重查 inventory）
    action: waitFor
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row, .app-content .ant-empty' }
    timeout: 10000

  - name: images-after-search
    action: screenshot

  - name: 清空搜索框
    action: fill
    locator:
      strategies:
        - { type: css, value: '.app-content input[placeholder*="搜索"]' }
    value: ""

  # ---- 2. 负向回归守卫：行内删除入口已下线（v0.5.29） ----
  # 依赖有数据：dev 158 上至少有 library/alpine、registry-manager、webauto-pull/busybox。
  # 空表环境会在本步 throw 「NEG_ASSERT_VACUOUS」，属数据前置问题，不是 App 缺陷。
  - name: 断言行内已无删除入口且每行都有「详情」
    action: evaluate
    script: |
      (async () => {
        const t0 = Date.now();
        const LIMIT = 8000;
        const rowSel = '.app-content table tbody tr.ant-table-row';
        const rowsOf = () => Array.from(document.querySelectorAll(rowSel));
        while (Date.now() - t0 < LIMIT && rowsOf().length < 1) {
          await new Promise(r => setTimeout(r, 150));
        }
        const rows = rowsOf();
        const dangerCount = document.querySelectorAll(rowSel + ' button.ant-btn-dangerous').length;
        const missingDetail = rows.filter(tr => {
          return !Array.from(tr.querySelectorAll('button')).some(b => {
            return (b.innerText || '').replace(/\s+/g, '').indexOf('详情') >= 0;
          });
        }).length;
        const names = rows.map(tr => {
          const td = tr.querySelector('td');
          return ((td && td.innerText) || '').replace(/\s+/g, ' ').trim();
        });
        const info = { rowCount: rows.length, dangerCount: dangerCount, missingDetail: missingDetail, rows: names };
        if (rows.length < 1) {
          throw new Error('NEG_ASSERT_VACUOUS: 表格无数据行，负向断言失去意义 ' + JSON.stringify(info));
        }
        if (dangerCount !== 0) {
          throw new Error('NEG_ASSERT_FAIL: 行内仍存在删除入口(期望 0 个 dangerous 按钮) ' + JSON.stringify(info));
        }
        if (missingDetail !== 0) {
          throw new Error('NEG_ASSERT_FAIL: 存在缺少「详情」入口的行 ' + JSON.stringify(info));
        }
        return JSON.stringify(info);
      })()

  # ---- 3. 详情抽屉（0.5.29 之后列表页唯一的行内入口） ----
  - name: 点击第一行「详情」
    action: click
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row button:has-text("详情")' }
        - { type: text, value: "详情", match: exact }
    timeout: 8000

  - name: 断言详情抽屉真打开（标题 + Descriptions 就位）
    action: evaluate
    script: |
      (async () => {
        const t0 = Date.now();
        const LIMIT = 8000;
        let info = {};
        while (Date.now() - t0 < LIMIT) {
          const content = document.querySelector('.ant-drawer .ant-drawer-content');
          const body = document.querySelector('.ant-drawer .ant-drawer-body');
          if (content && body) {
            const titleEl = document.querySelector('.ant-drawer .ant-drawer-title');
            const title = ((titleEl && titleEl.innerText) || '').trim();
            const hasDesc = !!document.querySelector('.ant-drawer .ant-descriptions');
            const bodyText = (body.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 200);
            info = { title: title, hasDescriptions: hasDesc, bodyHead: bodyText };
            if (title && hasDesc) return JSON.stringify(info);
          }
          await new Promise(r => setTimeout(r, 150));
        }
        throw new Error('DRAWER_ASSERT_FAIL: 详情抽屉未按预期打开 ' + JSON.stringify(info));
      })()

  - name: 关闭详情抽屉
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-drawer .ant-drawer-close' }
        - { type: css, value: '.ant-drawer-close' }
    timeout: 8000

  # ---- 4. GC 确认弹窗（不真跑） ----
  - name: 点击「运行 GC」按钮
    action: click
    locator:
      strategies:
        - { type: css, value: '.app-content button:has-text("运行 GC")' }
        - { type: text, value: "运行 GC", match: contains }
    timeout: 12000

  - name: 断言「确认运行 GC」弹窗
    action: assert
    type: visible
    # 此处 DOM 里可能已有隐藏驻留的旧 popover，必须加作用域
    selector: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("运 行"), .ant-popconfirm:not(.ant-popover-hidden) .ant-checkbox-input'
    timeout: 8000

  - name: 点击「取 消」（不真跑 GC）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons button:has-text("取 消")' }
        - { type: css, value: '.ant-popconfirm:not(.ant-popover-hidden) .ant-popconfirm-buttons .ant-btn-default' }
        - { type: text, value: "取 消", match: exact }
        - { type: text, value: "取消", match: exact }
    timeout: 8000

  - name: images-page-end
    action: screenshot

# 期望结果（步数与 steps 逐一对应：16）
expected:
  totalSteps: 16
  maxDuration: 120000