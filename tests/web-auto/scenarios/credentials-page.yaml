# cairn 凭据管理页 — 深度场景
#
# 覆盖：列表渲染、新增 Modal 打开并取消、测试连接（如有凭据）
#
# 用法：POST /api/run {scenario: "cairn/credentials-page", env: "dev"}
name: cairn-credentials-page
description: |
  凭据管理页深度交互：
    1. 切到凭据管理 Tab
    2. 打开「新增凭据」Modal
    3. 在 Modal 填写表单字段验证可输入
    4. 关闭 Modal（不真保存）
    5. 点击「测试连接」（如有凭据）观察反馈
env: dev
tags: [medium, credentials, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: on-failure
  trace: on-failure
  video: never
  har: never

steps:
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 15000

  - name: 点击「凭据管理」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "凭据管理", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("凭据管理")' }
    timeout: 8000

  - name: 等待凭据列表渲染
    action: assert
    type: visible
    selector: '.app-content button:has-text("新增"), .app-content .ant-table, .app-content .ant-empty'
    timeout: 15000

  # ---- 1. 新增 Modal ----
  - name: 点击「新增凭据」
    action: click
    locator:
      strategies:
        - { type: text, value: "新增凭据", match: exact }
        - { type: css, value: '.app-content button:has-text("新增凭据")' }
        - { type: css, value: '.app-content button:has-text("新增")' }
    timeout: 5000

  - name: 断言新增 Modal 标题
    action: assert
    type: text
    selector: '.ant-modal-title'
    value: "新增凭据"
    match: exact
    timeout: 5000

  - name: 填写「名称」字段
    action: fill
    locator:
      strategies:
        - { type: css, value: '.ant-modal-body .ant-form-item:has-text("名称") input' }
    value: "smoke-test-cred"
    timeout: 3000

  - name: 填写「Registry URL」字段
    action: fill
    locator:
      strategies:
        - { type: css, value: '.ant-modal-body .ant-form-item:has-text("Registry URL") input' }
        - { type: css, value: '.ant-modal-body .ant-form-item:has-text("URL") input' }
    value: "https://registry.example.com"
    timeout: 3000

  - name: credentials-modal-filled
    action: screenshot

  - name: 关闭 Modal（点 × 关闭）
    action: click
    locator:
      strategies:
        - { type: css, value: '.ant-modal-close' }
        - { type: aria, value: "Close" }
    timeout: 3000

  - name: 断言 Modal 关闭（content 已消失）
    action: assert
    type: visible
    selector: '.app-content button:has-text("新增凭据")'
    timeout: 5000

  # ---- 2. 测试连接（如有凭据行） ----
  - name: 点击第一行的「测试连接」
    action: click
    locator:
      strategies:
        - { type: css, value: 'table tbody tr.ant-table-row:first-child button' }
    timeout: 5000

  - name: 等测试连接反馈（loading 或 message）
    action: waitFor
    locator:
      strategies:
        - { type: css, value: '.ant-message, .ant-notification' }
    timeout: 10000

  - name: credentials-page-end
    action: screenshot

# 期望结果
expected:
  totalSteps: 14
  maxDuration: 90000