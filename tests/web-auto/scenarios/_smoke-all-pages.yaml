# cairn 全 6 Tab 顺序冒烟
# 覆盖：打开首页 → 切到 6 个 Tab → 每个 Tab 渲染成功 → 留底截图
# 用途：每次发版后第一轮 smoke；耗时 ~30~60s
name: cairn-smoke-all-pages
description: |
  顺序点击 cairn 顶部 Segmented 导航的 6 个 Tab：
  镜像列表 / 镜像热度 / 镜像拉取 / 凭据管理 / 代理管理 / 设置。
  每个 Tab 验证：
   1. 切换后 .app-content 出现非空内容（不是白屏 / "加载中…" 残留）
   2. 没有 antd Alert.error 出现
   3. 没有 unhandled error
  无副作用，不写任何状态。
env: "*"
tags: [smoke, regression, cairn]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  # ---- 0. 打开首页 ----
  - name: 打开 cairn 首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 30000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - type: css
          value: ".app-shell .app-header"
        - type: css
          value: ".app-shell"
    timeout: 15000

  # ---- 1. 镜像列表 ----
  - name: 点击「镜像列表」
    action: click
    locator:
      strategies:
        - type: text
          value: "镜像列表"
          match: exact
        - type: aria
          value: "镜像列表"
        - type: css
          value: '.app-nav .ant-segmented-item:has-text("镜像列表")'
    timeout: 8000

  - name: 断言镜像列表页渲染
    action: assert
    type: visible
    locator:
      strategies:
        - type: css
          value: '.app-content input[placeholder*="搜索"]'
        - type: css
          value: '.app-content button:has-text("刷新")'
        - type: css
          value: '.app-content .ant-table, .app-content .ant-empty'
    timeout: 10000

  - name: 截取镜像列表
    action: screenshot
    name: smoke-01-images

  # ---- 2. 镜像热度 ----
  - name: 点击「镜像热度」
    action: click
    locator:
      strategies:
        - type: text
          value: "镜像热度"
          match: exact
        - type: aria
          value: "镜像热度"
        - type: css
          value: '.app-nav .ant-segmented-item:has-text("镜像热度")'

  - name: 断言热度页渲染
    action: assert
    type: visible
    locator:
      strategies:
        - type: css
          value: '.app-content .ant-segmented'                    # 子 Tab
        - type: css
          value: '.app-content canvas, .app-content svg'           # heatmap 渲染
        - type: css
          value: '.app-content .ant-card, .app-content .ant-empty'
    timeout: 10000

  - name: 截取镜像热度
    action: screenshot
    name: smoke-02-stats

  # ---- 3. 镜像拉取 ----
  - name: 点击「镜像拉取」
    action: click
    locator:
      strategies:
        - type: text
          value: "镜像拉取"
          match: exact
        - type: aria
          value: "镜像拉取"
        - type: css
          value: '.app-nav .ant-segmented-item:has-text("镜像拉取")'

  - name: 断言拉取页渲染
    action: assert
    type: visible
    locator:
      strategies:
        - type: css
          value: '.app-content input[placeholder*="源"], .app-content input[placeholder*="镜像"]'
        - type: css
          value: '.app-content button:has-text("提交"), .app-content button:has-text("拉取")'
        - type: css
          value: '.app-content .ant-form'
    timeout: 10000

  - name: 截取镜像拉取
    action: screenshot
    name: smoke-03-pull

  # ---- 4. 凭据管理 ----
  - name: 点击「凭据管理」
    action: click
    locator:
      strategies:
        - type: text
          value: "凭据管理"
          match: exact
        - type: aria
          value: "凭据管理"
        - type: css
          value: '.app-nav .ant-segmented-item:has-text("凭据管理")'

  - name: 断言凭据页渲染
    action: assert
    type: visible
    locator:
      strategies:
        - type: css
          value: '.app-content button:has-text("新增")'
        - type: css
          value: '.app-content .ant-table, .app-content .ant-empty'
    timeout: 10000

  - name: 截取凭据管理
    action: screenshot
    name: smoke-04-credentials

  # ---- 5. 代理管理 ----
  - name: 点击「代理管理」
    action: click
    locator:
      strategies:
        - type: text
          value: "代理管理"
          match: exact
        - type: aria
          value: "代理管理"
        - type: css
          value: '.app-nav .ant-segmented-item:has-text("代理管理")'

  - name: 断言代理页渲染
    action: assert
    type: visible
    locator:
      strategies:
        - type: css
          value: '.app-content button:has-text("新增")'
        - type: css
          value: '.app-content button:has-text("批量探测"), .app-content button:has-text("探测")'
        - type: css
          value: '.app-content .ant-table, .app-content .ant-empty'
    timeout: 10000

  - name: 截取代理管理
    action: screenshot
    name: smoke-05-proxies

  # ---- 6. 设置 ----
  - name: 点击「设置」
    action: click
    locator:
      strategies:
        - type: text
          value: "设置"
          match: exact
        - type: aria
          value: "设置"
        - type: css
          value: '.app-nav .ant-segmented-item:has-text("设置")'

  - name: 断言设置页渲染
    action: assert
    type: visible
    locator:
      strategies:
        - type: css
          value: '.app-content button:has-text("刷新")'
        - type: css
          value: '.app-content button:has-text("探测")'
        - type: css
          value: '.app-content .ant-form, .app-content .ant-card'
    timeout: 10000

  - name: 断言版本号徽章可见
    action: assert
    type: visible
    locator:
      strategies:
        - type: css
          value: '.app-brand .app-brand-version'
        - type: css
          value: 'span[title^="当前运行版本"]'
    timeout: 5000

  - name: 截取设置
    action: screenshot
    name: smoke-06-settings

cleanup:
  - action: screenshot
    name: smoke-end

expected:
  totalSteps: 20
  maxDuration: 90000