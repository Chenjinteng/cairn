# cairn 镜像列表页 — 「删除入口回归守卫 + 仓库删除端点契约」场景（**非破坏性**）
#
# v0.5.29 起镜像列表行内**不再有「删除仓库」入口**（images-page.tsx:229-242 的决策注释：
#   一键删整个仓库既危险又没意义 —— 删 manifest 只解引用，磁盘要 GC 才回收；正确路径是
#   「进详情 → 删完所有 tag → 回列表 → 运行 GC + 勾『也清理 0 tag 仓库』」）。
#   本场景因此改成两件事，都不修改数据：
#     ① UI 负向回归守卫：任何仓库行出现 danger 按钮、或缺「详情」按钮 → 硬失败
#     ② 后端保留端点契约：DELETE /api/repositories/{repo} 仍在（handlers_extra.go:586-608），
#        但对**多段名**走 %2F 形态必然 500 storage: not found，且探针前后
#        GET /api/inventory 完全一致（无副作用）
#
# 实测锚定（2026-09-28，cairn:0.5.34，158 dev）：
#   DELETE /api/repositories/webauto-pull%2Fbusybox
#     → 500 {"code":"INTERNAL_ERROR","message":"storage: not found"}
#   成因：chi 按 RawPath 匹配、{repo} 原样带 %2F，storage.stat(root/repos/webauto-pull%2Fbusybox)
#   必然失败（filesystem.go:707-728 的 os.Stat 分支）。探针后目录仍在、inventory 未变。
#   单段名的可用路径由 delete-repo-real.yaml 单独验证（期望 200 {"repo":…,"deleted":true}）。
#
# ⚠️ 选择器/断言要点（逐条对着源码核过）
#   1. 行内「详情」按钮是 2 汉字、无 icon（images-page.tsx:238）→ antd autoInsertSpace
#      可能把它渲染成「详 情」，所以守卫脚本内用 textContent.replace(/\s+/g,'') 归一化后
#      再比对，**不依赖字面空格**。
#   2. evaluate 无断言能力（runner.js 的 case 'evaluate' 只 return {status,result}）：
#      一切「页内异步 + 等条件」都写成脚本内轮询/比对 → 注入 DOM 标记 → 再由 assert
#      对标记做硬闸门（本场景标记：#__del_guard / #__del_probe / #__del_inv）。
#   3. assert type:text 走 page.textContent + RegExp.test（**部分匹配**）→ 一律用 ^…$ 全锚定。
#   4. 探针是页内 fetch（同源，无 CORS 问题），打的就是浏览器真实会走的请求路径。
#
# 步数 × 时长口径：runner.js:274 `stepTimeoutMs = timeout / max(steps, 5)`。
#   本场景 14 步、跑时传 timeout=300000 → 单步硬上限 300000/14 = 21428ms，
#   故所有显式 timeout ≤12000ms 都在预算内。
#
# 前置：registry 至少 1 个仓库（推荐在 delete-tag-real 之后跑，本场景对 tag 数不敏感）
# 用法：POST /api/run {scenario: "cairn/delete-real", env: "dev", timeout: 300000}
name: cairn-delete-real
description: |
  删除入口回归守卫 + 仓库删除端点契约（非破坏性）：
    1. 打开镜像列表，全表扫描：任何行出现仓库级 danger「删除」按钮 → 失败（v0.5.29 已移除）
    2. 记录探针前 GET /api/inventory 快照
    3. 页内 fetch 探针 DELETE /api/repositories/webauto-pull%2Fbusybox
    4. 断言 500 storage: not found（多段名 %2F 形态不可用；端点为刻意保留，API 契约无变化）
    5. 断言探针前后 inventory 完全一致（无副作用）且目标仓库仍在
  真正的删除路径：tag 级 → delete-tag-real.yaml；单段名仓库级 → delete-repo-real.yaml；
  0 tag 仓库回收 → gc-real.yaml。
env: dev
tags: [images, cairn, contract]

target:
  baseUrl: "{{env.baseUrl}}"

artifacts:
  screenshot: always
  trace: on-failure
  video: never
  har: never

steps:
  # ---- 0. 导航 ----
  - name: 打开首页
    action: goto
    url: "{{baseUrl}}/"
    timeout: 12000

  - name: 等待主框架
    action: waitFor
    locator:
      strategies:
        - { type: css, value: ".app-shell" }
    timeout: 12000

  - name: 点击「镜像列表」Tab
    action: click
    locator:
      strategies:
        - { type: text, value: "镜像列表", match: exact }
        - { type: css, value: '.app-nav .ant-segmented-item:has-text("镜像列表")' }
    timeout: 8000

  - name: 等待列表页就绪（搜索框）
    action: assert
    type: visible
    selector: '.app-content input[placeholder*="搜索"]'
    timeout: 12000

  - name: 等待仓库表格出现至少一行
    action: waitFor
    locator:
      strategies:
        - { type: css, value: "table tbody tr.ant-table-row" }
    timeout: 12000

  - name: delete-real-before
    action: screenshot

  # ---- 1. UI 负向回归守卫（v0.5.29 移除的入口不得回来）----
  - name: 负向守卫：全表不得出现仓库级删除按钮
    action: evaluate
    script: |
      (async () => {
        const rows = Array.from(document.querySelectorAll('.app-content table tbody tr.ant-table-row'));
        if (!rows.length) throw new Error('guard: no repository row rendered');
        const bad = [];
        rows.forEach((tr, i) => {
          const btns = Array.from(tr.querySelectorAll('button'));
          const danger = btns.filter(b => b.classList.contains('ant-btn-dangerous'));
          const labels = btns.map(b => (b.textContent || '').replace(/\s+/g, ''));
          const hasDetail = labels.some(t => t === '详情');
          const firstCell = (tr.innerText || '').split('\n')[0].trim();
          if (danger.length) bad.push('row' + i + '(' + firstCell + ') 有 ' + danger.length + ' 个 danger 按钮');
          if (!hasDetail) bad.push('row' + i + '(' + firstCell + ') 缺「详情」按钮 labels=' + JSON.stringify(labels));
        });
        if (bad.length) throw new Error('v0.5.29 仓库级删除入口回归: ' + bad.join('; '));
        const old = document.getElementById('__del_guard');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__del_guard';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'guard-ok rows=' + rows.length;
        document.body.appendChild(d);
        return JSON.stringify({ rows: rows.length, ok: true });
      })()

  - name: 断言守卫通过（标记 guard-ok）
    action: assert
    type: text
    selector: '#__del_guard'
    value: '^guard-ok rows=[1-9][0-9]*$'
    match: regex
    timeout: 6000

  # ---- 2. 保留端点契约探针（不修改数据）----
  - name: 记录探针前 inventory 快照
    action: evaluate
    script: |
      (async () => {
        const res = await fetch('/api/inventory', { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('inventory HTTP ' + res.status);
        const json = await res.json();
        const payload = (json && json.data) ? json.data : json;
        const rows = ((payload && payload.repositories) || [])
          .map(r => r.name + ':' + (r.tagCount === undefined ? (r.tags || []).length : r.tagCount))
          .sort();
        const old = document.getElementById('__del_inv_before');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__del_inv_before';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'BEFORE:' + rows.join(',');
        document.body.appendChild(d);
        return JSON.stringify({ count: rows.length, rows: rows });
      })()

  - name: 契约探针 DELETE /api/repositories/webauto-pull%2Fbusybox
    action: evaluate
    script: |
      (async () => {
        const res = await fetch('/api/repositories/webauto-pull%2Fbusybox', { method: 'DELETE' });
        const text = await res.text();
        const body = (text || '').replace(/\s+/g, ' ').trim().slice(0, 300);
        const old = document.getElementById('__del_probe');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__del_probe';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'PROBE:' + res.status + ':' + body;
        document.body.appendChild(d);
        return JSON.stringify({ status: res.status, body: body });
      })()

  - name: '断言探针回 500 storage: not found'
    action: assert
    type: text
    selector: '#__del_probe'
    value: '^PROBE:500:.*storage: not found.*$'
    match: regex
    timeout: 6000

  - name: 断言无副作用：inventory 未变且仓库仍在
    action: evaluate
    script: |
      (async () => {
        const snap = document.getElementById('__del_inv_before');
        const raw = snap ? (snap.textContent || '') : '';
        if (raw.indexOf('BEFORE:') !== 0) throw new Error('探针前快照缺失：未读到 #__del_inv_before');
        const before = raw.slice('BEFORE:'.length);
        const res = await fetch('/api/inventory', { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('inventory HTTP ' + res.status);
        const json = await res.json();
        const payload = (json && json.data) ? json.data : json;
        const repos = (payload && payload.repositories) || [];
        const rows = repos
          .map(r => r.name + ':' + (r.tagCount === undefined ? (r.tags || []).length : r.tagCount))
          .sort();
        const after = rows.join(',');
        const hit = repos.find(r => r.name === 'webauto-pull/busybox');
        const tags = hit ? (hit.tagCount === undefined ? (hit.tags || []).length : hit.tagCount) : -1;
        const state = before === after ? 'unchanged' : 'CHANGED';
        const old = document.getElementById('__del_inv');
        if (old) old.remove();
        const d = document.createElement('div');
        d.id = '__del_inv';
        d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;font-size:1px;color:transparent;';
        d.textContent = 'INV:' + state + ':busybox=' + (hit ? 'present' : 'missing') + ':tags=' + tags;
        document.body.appendChild(d);
        if (state !== 'unchanged') throw new Error('探针产生副作用: before=' + before + ' after=' + after);
        if (!hit) throw new Error('探针把 webauto-pull/busybox 删掉了（本应 500 无副作用）');
        return JSON.stringify({ state: state, tags: tags, before: before, after: after });
      })()

  - name: 断言无副作用标记
    action: assert
    type: text
    selector: '#__del_inv'
    value: '^INV:unchanged:busybox=present:tags=\d+$'
    match: regex
    timeout: 6000

  - name: delete-real-after
    action: screenshot

# 期望结果（步数与 steps 逐一对应：14）
expected:
  totalSteps: 14
  maxDuration: 300000