# web-auto UAT 环境配置
#
# 拓扑说明：
#   runner @ proxy.example.com:8080
#   UAT 真实环境按需调整 baseUrl；如果 runner 与 cairn 不在同一网段，
#   可能需要再加一个 nginx 反代层
#
# 已被 runner 容器 bind mount 到 /config/web-auto.uat.yaml（ro）
env: uat

# 占位——按 UAT 实际拓扑改
baseUrl: "http://uat.cairn.internal:8080"

users:
  admin:
    username: "admin"
    password: "admin"

timeouts:
  default: 90000
  navigation: 45000
  locator: 15000
  inventory: 180000

artifacts:
  defaultPolicy:
    screenshot: on-failure          # UAT 阶段截图减半
    trace: on-failure
    video: never
    har: on-failure
  retention:
    keepLast: 50
    archiveToGitLfs: true