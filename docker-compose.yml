# 用法：
#   cp .env.example .env
#   docker compose up -d --build
#
# 这里只负责"接线"：变量一律从 .env 取，解释统一放在 .env.example。
# 跟 registry-manager 的 compose 字段名保持一致，方便两边切换。

services:
  cairn:
    build:
      context: .
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
        # Go 模块代理：构建机访问 proxy.golang.org 受限/慢时,在 .env 里改成
        #   GOPROXY=https://goproxy.cn,direct
        #   GOPROXY=https://goproxy.io,direct
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        # 通用 HTTP/HTTPS 代理：跟 GOPROXY 正交,影响 builder stage 内所有网络出口。
        # 在 .env 里设 BUILD_HTTP_PROXY / BUILD_HTTPS_PROXY / BUILD_NO_PROXY 即可。
        # 默认空 = 不用代理(行为跟之前一致)。
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        # 前端构建（v0.4 新增）：node 镜像与 npm registry 镜像（受限网络用）
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-}

    image: ${IMAGE:-cairn:0.5.3}
    container_name: cairn
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8787}:8787"

    environment:
      # v0.5.0: REGISTRY_URL is OPTIONAL -- empty means "no managed upstream";
      # the UI defaults to Docker Hub for pulls that don't pin a source.
      # All REGISTRY_* names are kept for back-compat; only this one changed
      # from required to optional.
      REGISTRY_URL: ${REGISTRY_URL:-}
      REGISTRY_NAME: ${REGISTRY_NAME:-镜像仓库}
      REGISTRY_PROXY: ${REGISTRY_PROXY:-}
      REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      REGISTRY_CACHE_TTL_SECONDS: ${REGISTRY_CACHE_TTL_SECONDS:-60}
      REGISTRY_ALLOW_DELETE: ${REGISTRY_ALLOW_DELETE:-true}
      REGISTRY_ALLOW_PULL: ${REGISTRY_ALLOW_PULL:-true}
      REGISTRY_PULL_QUEUE_SIZE: ${REGISTRY_PULL_QUEUE_SIZE:-50}
      REGISTRY_PULL_HISTORY_RETENTION_DAYS: ${REGISTRY_PULL_HISTORY_RETENTION_DAYS:-90}
      REGISTRY_NOTIFY_TOKEN: ${REGISTRY_NOTIFY_TOKEN:-}
      REGISTRY_ALLOW_REGISTRY_EVENTS: ${REGISTRY_ALLOW_REGISTRY_EVENTS:-true}
      REGISTRY_STATS_RETENTION_DAYS: ${REGISTRY_STATS_RETENTION_DAYS:-365}
      REGISTRY_STATS_IGNORE_USERAGENTS: ${REGISTRY_STATS_IGNORE_USERAGENTS:-}
      REGISTRY_CREDENTIAL_KEY: ${REGISTRY_CREDENTIAL_KEY:?请设置 REGISTRY_CREDENTIAL_KEY；任意随机 32+ 字符字符串，启动后切勿丢失}
      REGISTRY_CREDENTIALS_DIR: ${REGISTRY_CREDENTIALS_DIR:-/app/data}
      # v0.5.0: where blobs/manifests/tags live. Kept on its own named volume
      # so restarts don't drag the storage along with credentials (and vice
      # versa); separate volumes also let you re-image the app without wiping
      # either data set.
      REGISTRY_STORAGE_DIR: ${REGISTRY_STORAGE_DIR:-/app/registry}
      GO_HUB_ENV: ${GO_HUB_ENV:-prod}

    # Two named volumes so credentials and image storage can be backed up /
    # reset independently. App data (credentials + proxies + SQLite heat
    # DB) lives under /app/data; the actual registry content under
    # /app/registry -- mirroring how Docker Registry splits config from data.
    volumes:
      - cairn-data:/app/data
      - cairn-registry:/app/registry

volumes:
  cairn-data:
  cairn-registry: