# 用法：
#   cp .env.example .env
#   mkdir -p /data/cairn          # 宿主机数据目录，可用 HOST_DATA_DIR 改名
#   docker compose up -d --build
#
# 这里只负责"接线"：变量一律从 .env 取，解释统一放在 .env.example。
#
# 破坏性变更（相对上一版部署方式）：运行时环境变量只剩 2 个，数据不再放 named
# volume 而是直接落在宿主机目录。从旧部署升级请先做数据迁移 —— 步骤见 README
# 「部署」一节；直接 up 会看到一个空仓库。

services:
  cairn:
    build:
      context: .
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
        # Go 模块代理：构建机访问 proxy.golang.org 受限/慢时,在 .env 里改成
        #   GOPROXY=https://goproxy.cn,direct
        #   GOPROXY=https://goproxy.io,direct
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        # 通用 HTTP/HTTPS 代理：跟 GOPROXY 正交,影响 builder stage 内所有网络出口。
        # 在 .env 里设 BUILD_HTTP_PROXY / BUILD_HTTPS_PROXY / BUILD_NO_PROXY 即可。
        # 默认空 = 不用代理(行为跟之前一致)。
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        # 前端构建（v0.4 新增）：node 镜像与 npm registry 镜像（受限网络用）
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-}

    image: ${IMAGE:-cairn:0.7.41}
    container_name: cairn
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8787}:8787"

    # 运行时只有这三个环境变量：
    #   - 业务配置（registry 地址/代理/账号/各开关/保留天数…）v0.5.9 起就以
    #     UI → SQLite 为准，.env 里再写 REGISTRY_* 也不会被读；
    #   - 容器内路径（/app/data、/app/data/registry）是编译期常量，不接受 env
    #     覆盖。要挪数据只改下面的 HOST_DATA_DIR（宿主机侧）。
    environment:
      REGISTRY_CREDENTIAL_KEY: ${REGISTRY_CREDENTIAL_KEY:?请设置 REGISTRY_CREDENTIAL_KEY；任意随机 32+ 字符字符串，启动后切勿丢失}
      # v0.5.23: GO_HUB_ENV → CAIRN_ENV。同名同名,只是换字面。
      CAIRN_ENV: ${CAIRN_ENV:-prod}
      # v0.5.40: HOST_PORT —— 宿主机侧对外端口。cairn 进程跑在容器里看不到
      # docker 的 ports 映射,需要把左侧端口显式传进来,UI 才能同时显示
      # 「容器内 8787 / 宿主机 ${HOST_PORT}」,运维一眼分清两者区别。
      # 与上方 ports 映射保持一致。
      HOST_PORT: ${HOST_PORT:-8787}

    # 单一 bind mount：数据直接落在宿主机目录，不再是 named volume。
    # /app/data 一个目录装齐全部状态 —— credentials.json（凭据库）、
    # proxies.json（代理库）、cairn.db / heat.db（SQLite）、
    # registry/（镜像 blobs / manifests / tags）。
    # 备份 = 打包这一个目录；迁移 = 拷贝这一个目录。
    volumes:
      - ${HOST_DATA_DIR:-/data/cairn}:/app/data