<!--
  v0.5.38：Cairn 品牌 favicon —— 与 web/src/components/cairn-mark.tsx 几何保持一致：
    三块圆角矩形堆叠成塔身（teal-600 #0d9488），顶部琥珀色标记点（amber-500 #f59e0b）。
  viewBox 64x64,浏览器会把整张 SVG 缩到 16/32/180 等任何尺寸,字面一致。

  选用 SVG 而非 .ico 的原因：单文件即可覆盖所有 DPI 与主题(浏览器自动重采样),
  不需要为 16/32/48/64 各出一份位图。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="6" y="46" width="52" height="12" rx="3" fill="#0d9488"/>
  <rect x="14" y="32" width="36" height="10" rx="2.5" fill="#0d9488"/>
  <rect x="22" y="20" width="20" height="9" rx="2" fill="#0d9488"/>
  <circle cx="32" cy="10" r="3.5" fill="#f59e0b"/>
</svg>