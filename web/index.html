<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cairn</title>
    <!--
      v0.5.37：UI 改版 — 三字体，对齐 docs/design/cairn-ui-design.html § 2 Typography。
        Outfit          → UI 主字体（h1/h2/h3/body/button）；5 个 weight（300/400/500/600/700）
        DM Serif Display → hero（页面大数字 44px 用）；1 个 weight
        JetBrains Mono  → hash / digest / 时间戳 / id；3 个 weight（400/500/600）

      **不阻塞首屏**：用 `rel="preload" as="style"` 异步预加载，onload 后再切换
      为真正的 stylesheet。理由是内网 / 受限网络环境（测试 runner 53、企业
      proxy 等）下 fonts.googleapis.com 可能不可达或极慢 —— 用
      `<link rel="stylesheet">` 是 render-blocking，会让 chromium 的
      `domcontentloaded` 永不 fire（实测 30s timeout），导致整页卡白屏。
      `font-display: swap` + theme.css 的系统栈 fallback 兜底，让 CDN 失败时
      浏览器立刻用系统栈渲染，不白屏也不显示空白字。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
      onload="this.rel='stylesheet'; this.onload=null;">
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    </noscript>
    <script>
      /*
       * 在 React 挂载之前就把主题定下来。
       *
       * 为什么必须内联：主题是 `document.documentElement.dataset.theme` 上的一个属性，
       * 如果等 React 起来再设，首帧会先按浅色渲染一次 —— 深色用户会看到一瞬白屏闪烁。
       * 这段脚本必须同步执行、且位于样式之前。
       *
       * 取值顺序：上次的选择 > 系统偏好。读不到就按浅色（不报错、不阻塞）。
       * React 侧不重复这套逻辑，而是直接读这里已经设好的属性（见 main.tsx）。
       */
      (function () {
        try {
          var saved = localStorage.getItem('registry-manager-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var mode = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (error) {
          // 隐私模式 / 禁用存储时 localStorage 会抛错：主题退回浅色即可，不该因此白屏。
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
