<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cairn</title>
    <!--
      v0.5.37：UI 改版 — 三字体，对齐 docs/design/cairn-ui-design.html § 2 Typography。
        Outfit          → UI 主字体（h1/h2/h3/body/button）；5 个 weight（300/400/500/600/700）
        DM Serif Display → hero（页面大数字 44px 用）；1 个 weight
        JetBrains Mono  → hash / digest / 时间戳 / id；3 个 weight（400/500/600）

      v0.5.38：去掉了 `fonts.googleapis.com` / `fonts.gstatic.com` 的 <link>。
      原因：v0.5.37 引入了 Google Fonts CDN + `font-display: swap` 的兜底方案，
      但实测在离线 / 受限网络（53 跳板机、企业 proxy、纯内网部署）下，
      Chromium 仍会同步请求 woff2 文件直到超时（即便用了 `rel="preload"`），
      表现为网络面板里出现一长串超时请求、首次访问慢 30s+。
      现在完全不引入外部字体：theme.css 的 `--font-sans` / `--font-display` /
      `--font-mono` 已经填了系统栈 fallback,渲染效果与之前 CDN 成功时差异
      极小（中文浏览本地化无变化,西文走系统栈,Outfit 的圆润字形由 SF Pro /
      Segoe UI 等系统字体替代,基本一致）。
    -->
    <script>
      /*
       * 在 React 挂载之前就把主题定下来。
       *
       * 为什么必须内联：主题是 `document.documentElement.dataset.theme` 上的一个属性，
       * 如果等 React 起来再设，首帧会先按浅色渲染一次 —— 深色用户会看到一瞬白屏闪烁。
       * 这段脚本必须同步执行、且位于样式之前。
       *
       * 取值顺序：上次的选择 > 系统偏好。读不到就按浅色（不报错、不阻塞）。
       * React 侧不重复这套逻辑，而是直接读这里已经设好的属性（见 main.tsx）。
       */
      (function () {
        try {
          var saved = localStorage.getItem('registry-manager-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var mode = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (error) {
          // 隐私模式 / 禁用存储时 localStorage 会抛错：主题退回浅色即可，不该因此白屏。
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
