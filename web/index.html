<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cairn</title>
    <!--
      v0.5.37 引入 Google Fonts CDN + font-display: swap,与 docs/design/cairn-ui-design.html § 2 Typography 对齐。
        Outfit           → UI 主字体（h1/h2/h3/body/button）;5 个 weight (300/400/500/600/700)
        DM Serif Display → hero(页面大数字 44px 用);1 个 weight
        JetBrains Mono   → hash / digest / 时间戳 / id;3 个 weight (400/500/600)

      v0.5.38 短期去掉:实测在离线 / 受限网络(53 跳板机、企业 proxy、纯内网部署)下,
      Chromium 同步请求 woff2 文件直到超时(即便用了 `rel="preload"`),首次访问慢 30s+。
      该期间 theme.css 三个 token 改纯系统栈,渲染效果与 CDN 成功时差异小
      (西文走 SF Pro / Segoe UI,中文走 PingFang SC),换来「离线部署零外部依赖」。

      v0.7.37 改回 Google Fonts + system fallback。

      v0.7.53:三个字体(Outfit / DM Serif Display / JetBrains Mono)的 latin + latin-ext
      subset woff2 自托管到 web/public/fonts/(同源,vite build → internal/webui/dist
      打进二进制),theme.css 顶部 @font-face 块声明。本文件不再需要外链
      fonts.googleapis.com / gstatic.com —— 把 preconnect 和 stylesheet <link> 全删。
      改用 `<link rel="preload" as="font" type="font/woff2" crossorigin>` 把最常用的
      Outfit latin(覆盖 ~95% 字符)前置拉取,跟 v0.5.38 的 preload 走不通不一样,这次是
      同源路径,浏览器走主连接同一栈,不会撞公司 proxy 的解析路径。
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/outfit-latin.woff2">
    <script>
      /*
       * 在 React 挂载之前就把主题定下来。
       *
       * 为什么必须内联：主题是 `document.documentElement.dataset.theme` 上的一个属性，
       * 如果等 React 起来再设，首帧会先按浅色渲染一次 —— 深色用户会看到一瞬白屏闪烁。
       * 这段脚本必须同步执行、且位于样式之前。
       *
       * 取值顺序：上次的选择 > 系统偏好。读不到就按浅色（不报错、不阻塞）。
       * React 侧不重复这套逻辑，而是直接读这里已经设好的属性（见 main.tsx）。
       */
      (function () {
        try {
          var saved = localStorage.getItem('registry-manager-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var mode = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (error) {
          // 隐私模式 / 禁用存储时 localStorage 会抛错：主题退回浅色即可，不该因此白屏。
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
