<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cairn</title>
    <!--
      v0.5.37 引入 Google Fonts CDN + font-display: swap,与 docs/design/cairn-ui-design.html § 2 Typography 对齐。
        Outfit           → UI 主字体（h1/h2/h3/body/button）;5 个 weight (300/400/500/600/700)
        DM Serif Display → hero(页面大数字 44px 用);1 个 weight
        JetBrains Mono   → hash / digest / 时间戳 / id;3 个 weight (400/500/600)

      v0.5.38 短期去掉:实测在离线 / 受限网络(53 跳板机、企业 proxy、纯内网部署)下,
      Chromium 同步请求 woff2 文件直到超时(即便用了 `rel="preload"`),首次访问慢 30s+。
      该期间 theme.css 三个 token 改纯系统栈,渲染效果与 CDN 成功时差异小
      (西文走 SF Pro / Segoe UI,中文走 PingFang SC),换来「离线部署零外部依赖」。

      v0.7.37 改回 Google Fonts + system fallback(本行 <link> 即对应实现)。
      浏览器默认 font-display: swap,CDN 不通时立刻 fallback 到 system stack
      (字体声明里 Outfit / DM Serif / JetBrains Mono 后面都跟系统栈);
      不通≠阻塞,最坏情况是显示几秒 system stack 再到字体,与 v0.5.37 同款行为。
      设计稿 (docs/design/) 跟代码统一走 Google Fonts,不再「刻意不同」。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      /*
       * 在 React 挂载之前就把主题定下来。
       *
       * 为什么必须内联：主题是 `document.documentElement.dataset.theme` 上的一个属性，
       * 如果等 React 起来再设，首帧会先按浅色渲染一次 —— 深色用户会看到一瞬白屏闪烁。
       * 这段脚本必须同步执行、且位于样式之前。
       *
       * 取值顺序：上次的选择 > 系统偏好。读不到就按浅色（不报错、不阻塞）。
       * React 侧不重复这套逻辑，而是直接读这里已经设好的属性（见 main.tsx）。
       */
      (function () {
        try {
          var saved = localStorage.getItem('registry-manager-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var mode = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (error) {
          // 隐私模式 / 禁用存储时 localStorage 会抛错：主题退回浅色即可，不该因此白屏。
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
